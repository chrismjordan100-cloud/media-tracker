name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: aws s3 sync . s3://media-tracker-app-eggnog-915238109618-eu-north-1-an --exclude ".git/*" --exclude ".github/*" --exclude "desktop-app/*" --exclude ".gitignore" --exclude "_archive/*" --exclude "*.md" --exclude "*.docx" --exclude "*.html"
      # HTML is uploaded separately with no-cache so browsers and CloudFront
      # always revalidate and pick up new versions straight after a deploy.
      - name: Deploy HTML (no-cache)
        run: aws s3 cp . s3://media-tracker-app-eggnog-915238109618-eu-north-1-an --recursive --exclude "*" --include "*.html" --exclude ".git/*" --exclude ".github/*" --exclude "desktop-app/*" --exclude "_archive/*" --exclude "clear-cloud.html" --cache-control "no-cache, must-revalidate" --content-type "text/html; charset=utf-8"
      # clear-cloud.html can wipe ALL cloud data and the API has no login, so it is
      # a local-only tool: never deployed, and any previously deployed copy is removed.
      - name: Remove local-only tools from the live site
        run: aws s3 rm s3://media-tracker-app-eggnog-915238109618-eu-north-1-an/clear-cloud.html
      # CloudFront can keep serving an old copy of the HTML for up to a day after a
      # deploy. Invalidate it so the new version is live straight away. Non-fatal:
      # if these credentials can't invalidate, the deploy itself still succeeds.
      - name: Refresh CloudFront cache
        continue-on-error: true
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='d21se3p58mjg34.cloudfront.net'].Id" --output text)
          echo "Distribution: $DIST_ID"
          # Wildcards are only allowed at the END of a path, so "/*" (not "/*.html").
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
