name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: aws s3 sync . s3://media-tracker-app-eggnog-915238109618-eu-north-1-an --exclude ".git/*" --exclude ".github/*" --exclude "desktop-app/*" --exclude ".gitignore" --exclude "_archive/*" --exclude "*.md" --exclude "*.docx" --exclude "*.html"
      # HTML is uploaded separately with no-cache so browsers and CloudFront
      # always revalidate and pick up new versions straight after a deploy.
      - name: Deploy HTML (no-cache)
        run: aws s3 cp . s3://media-tracker-app-eggnog-915238109618-eu-north-1-an --recursive --exclude "*" --include "*.html" --exclude ".git/*" --exclude ".github/*" --exclude "desktop-app/*" --exclude "_archive/*" --cache-control "no-cache, must-revalidate" --content-type "text/html; charset=utf-8"
