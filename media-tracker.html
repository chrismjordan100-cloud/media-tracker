const SYNC_API = 'https://ditw97qgs2.execute-api.eu-north-1.amazonaws.com';
const USER_ID = 'chris';

function switchTab(tab){
const fT=document.getElementById('filmTab'),gT=document.getElementById('gameTab'),bT=document.getElementById('bookTab'),dT=document.getElementById('boardTab');

if(tab==='film'){fT.className='tab-btn active-film';fF.classList.remove('hidden')}
else if(tab==='game'){gT.className='tab-btn active-game';gF.classList.remove('hidden')}
else if(tab==='book'){bT.className='tab-btn active-book';bF.classList.remove('hidden')}
else{dT.className='tab-btn active-board';dF.classList.remove('hidden')}
}

// Cloud sync functions
async function cloudSave(dataKey, data){
  try{
    const str=JSON.stringify(data);
    // DynamoDB has 400KB limit - split large items into chunks
    const CHUNK_SIZE=350000;
    if(str.length>CHUNK_SIZE){
      const chunks=Math.ceil(str.length/CHUNK_SIZE);
      for(let i=0;i<chunks;i++){
        const chunk=str.substring(i*CHUNK_SIZE,(i+1)*CHUNK_SIZE);
        await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey:dataKey+'__chunk_'+i,data:chunk})});
      }
      // Save chunk count
      await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey:dataKey+'__chunks',data:chunks})});
    }else{
      await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey,data})});
    }
  }catch(e){console.error('Cloud save error:',e)}
}

async function cloudLoadAll(){
  try{
    const resp=await fetch(SYNC_API+'/load?userId='+USER_ID);
    if(resp.ok){
      const data=await resp.json();
      if(Object.keys(data).length===0){alert('No cloud data found.');return}
      // Reassemble chunked items
      const assembled={};
      const chunkCountKeys=Object.keys(data).filter(k=>k.endsWith('__chunks'));
      const chunkDataKeys=Object.keys(data).filter(k=>k.includes('__chunk_'));
      const regularKeys=Object.keys(data).filter(k=>!k.includes('__chunk'));
      // Regular items
      regularKeys.forEach(key=>{
        const val=data[key];
        assembled[key]=typeof val==='string'?val:JSON.stringify(val);
      });
      // Chunked items
      chunkCountKeys.forEach(ck=>{
        const baseKey=ck.replace('__chunks','');
        const count=typeof data[ck]==='string'?parseInt(data[ck]):data[ck];
        let full='';
        for(let i=0;i<count;i++){
          const chunkVal=data[baseKey+'__chunk_'+i];
          if(chunkVal)full+=typeof chunkVal==='string'?chunkVal:JSON.stringify(chunkVal);
        }
        if(full)assembled[baseKey]=full;
      });
      // Write to localStorage
      Object.entries(assembled).forEach(([key,val])=>{localStorage.setItem(key,val)});
      alert('Pulled '+Object.keys(assembled).length+' items from cloud. Reloading...');
      window.location.reload();
    }else{alert('Cloud load failed: '+resp.status)}
  }catch(e){alert('Cloud error: '+e.message)}
}

// Cloud sync - use ☁↓ button to pull from cloud on new devices

async function syncToCloud(){
  let count=0;
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    const val=localStorage.getItem(key);
    // Use raw string length to decide chunking
    if(val.length>350000){
      const chunks=Math.ceil(val.length/350000);
      for(let c=0;c<chunks;c++){
        const chunk=val.substring(c*350000,(c+1)*350000);
        await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey:key+'__chunk_'+c,data:chunk})});
      }
      await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey:key+'__chunks',data:chunks})});
      count++;
    }else{
      await fetch(SYNC_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER_ID,dataKey:key,data:val})});
      count++;
    }
  }
  alert('Synced '+count+' items to cloud!');
}

function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    data[key]=localStorage.getItem(key);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='media-tracker-backup-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      Object.entries(data).forEach(([key,val])=>{localStorage.setItem(key,val)});
      alert('Data imported successfully! Refreshing...');
      location.reload();
    }catch(err){alert('Error reading file: '+err.message)}
  };
  reader.readAsText(file);
  event.target.value='';
}

function normalize(t){return (t||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function makeSortTitle(t){return (t||'').toLowerCase().replace(/^(the|a|an)\\s+/,'')}
function makeFilm(title,id){return{id,title,addedDate:new Date().toISOString(),sortTitle:makeSortTitle(title),year:0,mediaType:'film',category:'',goatTier:0,rating:'',watched:false,watchSoon:false,watchHistory:[],moods:[],notes:'',director:'',cast:'',imdbRating:'',imdbId:'',tmdbId:null,runtime:0,certificate:'',posterWrong:false,posterConfirmed:false,needsEstimate:false}}

function save(){
  localStorage.setItem('ft_films',JSON.stringify(films));
  localStorage.setItem('ft_posters',JSON.stringify(posters));
  localStorage.setItem('ft_deleted',JSON.stringify(deletedIds));
  localStorage.setItem('ft_deleted_titles',JSON.stringify(deletedTitles));
}

function load(){
  const saved=localStorage.getItem('ft_films');
  if(saved){films=JSON.parse(saved)}else{films=[...FULL_SEED]}
  const p=localStorage.getItem('ft_posters');
  if(p)posters=JSON.parse(p);else posters={};
  const d=localStorage.getItem('ft_deleted');
  if(d)deletedIds=JSON.parse(d);else deletedIds=[];
  const dt=localStorage.getItem('ft_deleted_titles');
  if(dt)deletedTitles=JSON.parse(dt);else deletedTitles=[];
}

function runMigrations(){
  films.forEach(f=>{
    if(f.watchHistory===undefined)f.watchHistory=[];
    if(f.moods===undefined)f.moods=[];
    if(f.notes===undefined)f.notes='';
    if(f.posterWrong===undefined)f.posterWrong=false;
    if(f.posterConfirmed===undefined)f.posterConfirmed=false;
    if(f.needsEstimate===undefined)f.needsEstimate=false;
    if(f.watchSoon===undefined)f.watchSoon=false;
    if(f.sortTitle===undefined)f.sortTitle=makeSortTitle(f.title);
    if(f.imdbId===undefined)f.imdbId='';
    if(f.tmdbId===undefined)f.tmdbId=null;
    if(f.runtime===undefined)f.runtime=0;
    if(f.certificate===undefined)f.certificate='';
  });
  // Corruption cleanup
  films.forEach(f=>{
    if(f.rating==='amazing'&&!f.notes&&(!f.moods||f.moods.length===0)){
      const realPlays=(f.watchHistory||[]).filter(w=>!w.historical&&w.date);
      if(realPlays.length===0){f.rating='';f.watched=false;f.watchHistory=[];}
    }
  });
}

function mergeNewList(){
  const existing=new Set(films.map(f=>normalize(f.title)));
  const deleted=new Set(deletedTitles);
  NEWLIST.forEach(title=>{
    const norm=normalize(title);
    if(!existing.has(norm)&&!deleted.has(norm)){
      maxId++;
      films.push(makeFilm(title,maxId));
      existing.add(norm);
    }
  });
}

function updateMaxId(){maxId=films.reduce((m,f)=>Math.max(m,f.id),0)}

function getWatchCount(f){return (f.watchHistory||[]).length}

function getFiltered(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const type=document.getElementById('typeFilter').value;
  const genre=document.getElementById('genreFilter').value;
  const decade=document.getElementById('decadeFilter').value;
  const rating=document.getElementById('ratingFilter').value;
  const flag=document.getElementById('flagFilter').value;
  const cover=document.getElementById('coverFilter').value;
  const director=document.getElementById('directorFilter').value;
  const cast=document.getElementById('castFilter').value;

  return films.filter(f=>{
    if(search&&!f.title.toLowerCase().includes(search)&&!(f.director||'').toLowerCase().includes(search)&&!(f.cast||'').toLowerCase().includes(search))return false;
    if(type&&f.mediaType!==type)return false;
    if(genre&&f.category!==genre)return false;
    if(decade){const d=parseInt(decade);if(!f.year||f.year<d||f.year>=d+10)return false}
    if(rating){
      if(rating==='goat'){if(f.goatTier===0)return false}
      else if(rating==='unrated'){if(f.rating!==''||f.goatTier>0)return false;if(!f.watched)return false}
      else{if(f.goatTier>0)return true;if(f.rating!==rating)return false}
    }
    if(flag==='needsrating'&&!(f.watched&&!f.rating&&f.goatTier===0))return false;
    if(flag==='needsestimate'&&!f.needsEstimate)return false;
    if(flag==='soon'&&!f.watchSoon)return false;
    if(flag==='katie'&&!f.watchWithKatie)return false;
    if(flag==='streaming'&&!f.streamingOn)return false;
    if(flag==='new'&&(!f.addedDate||Date.now()-new Date(f.addedDate).getTime()>86400000))return false;
    if(cover==='wrong'&&!f.posterWrong)return false;
    if(cover==='confirmed'&&!f.posterConfirmed)return false;
    if(cover==='unreviewed'&&(f.posterWrong||f.posterConfirmed))return false;
    if(director&&!(f.director||'').includes(director))return false;
    if(cast&&!(f.cast||'').includes(cast))return false;
    const cert=document.getElementById('certFilter').value;
    if(cert&&f.certificate!==cert)return false;
    return true;
  });
}

function sortItems(items){
  const sort=document.getElementById('sortSelect').value;
  const copy=[...items];
  if(sort==='az')return copy.sort((a,b)=>(a.sortTitle||makeSortTitle(a.title)).localeCompare(b.sortTitle||makeSortTitle(b.title)));
  if(sort==='year')return copy.sort((a,b)=>(b.year||0)-(a.year||0));
  if(sort==='mostwatched')return copy.sort((a,b)=>getWatchCount(b)-getWatchCount(a));
  if(sort==='imdb')return copy.sort((a,b)=>(parseFloat(b.imdbRating)||0)-(parseFloat(a.imdbRating)||0));
  if(sort==='series'){
    const getFranchise=t=>(t||'').replace(/\\s+(I{1,3}V?|V?I{0,3}|\\d+)\\s*$/i,'').toLowerCase();
    return copy.sort((a,b)=>{const fa=getFranchise(a.title),fb=getFranchise(b.title);if(fa!==fb)return fa.localeCompare(fb);return(a.year||0)-(b.year||0)});
  }
  // Default: tier sort
  return copy.sort((a,b)=>{
    const tierOrder=t=>t.goatTier>0?4-t.goatTier:t.rating==='amazing'?4:t.rating==='good'?5:t.rating==='meh'?6:t.rating==='dislike'?7:t.rating==='neveragain'?8:t.watched?9:10;
    const ta=tierOrder(a),tb=tierOrder(b);
    if(ta!==tb)return ta-tb;
    // Within ★★★ GOAT, use manual order if set
    if(a.goatTier===3&&b.goatTier===3){
      const aIsTV=(a.mediaType==='tv'||a.mediaType==='comedy')?1:0;
      const bIsTV=(b.mediaType==='tv'||b.mediaType==='comedy')?1:0;
      if(aIsTV!==bIsTV)return aIsTV-bIsTV;
      // Manual order within subgroup
      const orderKey=aIsTV?'goat3OrderTV':'goat3OrderFilm';
      const order=JSON.parse(localStorage.getItem(orderKey)||'[]');
      if(order.length>0){
        const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
        const aPos=ai>=0?ai:9999;
        const bPos=bi>=0?bi:9999;
        if(aPos!==bPos)return aPos-bPos;
      }
    }
    return(a.sortTitle||'').localeCompare(b.sortTitle||'');
  });
}

function getTierSection(f){
  if(f.goatTier===3)return{label:'★★★ GOAT — All-Time Favourites',cls:'goat'};
  if(f.goatTier===2)return{label:'★★ GOAT — Absolute Favourites',cls:'goat'};
  if(f.goatTier===1)return{label:'★ GOAT — Favourites',cls:'goat'};
  if(f.rating==='amazing')return{label:'Amazing',cls:'amazing'};
  if(f.rating==='good')return{label:'Good',cls:'good'};
  if(f.rating==='meh')return{label:'Meh',cls:'meh'};
  if(f.rating==='dislike')return{label:"Didn't Like",cls:'dislike'};
  if(f.rating==='neveragain')return{label:'Never Again',cls:'neveragain'};
  if(f.watched)return{label:'Unrated',cls:'unrated'};
  return{label:'Unwatched',cls:'unplayed'};
}

function populatePersonFilters(){
  const dirSel=document.getElementById('directorFilter');
  const castSel=document.getElementById('castFilter');
  const curDir=dirSel.value,curCast=castSel.value;
  const dirs=new Set(),casts=new Set();
  films.forEach(f=>{
    if(f.director)(f.director).split(',').forEach(d=>{const t=d.trim();if(t)dirs.add(t)});
    if(f.cast)(f.cast).split(',').forEach(c=>{const t=c.trim();if(t)casts.add(t)});
  });
  dirSel.innerHTML='<option value="">All Directors</option>'+[...dirs].sort().map(d=>'<option value="'+d+'">'+d+'</option>').join('');
  castSel.innerHTML='<option value="">All Cast</option>'+[...casts].sort().map(c=>'<option value="'+c+'">'+c+'</option>').join('');
  dirSel.value=curDir;castSel.value=curCast;
}

function populateGenreFilter(){
  const sel=document.getElementById('genreFilter');
  sel.innerHTML='<option value="">All Genres</option>'+GENRES.map(g=>'<option value="'+g+'">'+g+'</option>').join('');
}

function populateDecadeFilter(){
  const decades=new Set();
  films.forEach(f=>{if(f.year)decades.add(Math.floor(f.year/10)*10)});
  const sel=document.getElementById('decadeFilter');
  sel.innerHTML='<option value="">All Decades</option>'+[...decades].sort((a,b)=>b-a).map(d=>'<option value="'+d+'">'+d+'s</option>').join('');
}

function updateStats(){
  const total=films.length;
  const watched=films.filter(f=>f.watched||f.goatTier>0).length;
  const totalWatches=films.reduce((s,f)=>s+getWatchCount(f),0);
  const goats=films.filter(f=>f.goatTier>0).length;
  const amazing=films.filter(f=>f.rating==='amazing').length;
  const unwatched=films.filter(f=>!f.watched&&f.goatTier===0).length;
  const soon=films.filter(f=>f.watchSoon).length;
  const needsRating=films.filter(f=>f.watched&&!f.rating&&f.goatTier===0).length;
  let html='<span>Total: '+total+'</span><span>Watched: '+watched+'</span><span>Watches: '+totalWatches+'</span>';
  html+='<span>GOAT: '+goats+'</span><span>Amazing: '+amazing+'</span>';
  html+='<span style="cursor:pointer;text-decoration:underline" onclick="document.getElementById(\\'ratingFilter\\').value=\\'\\';renderGrid()">Unwatched: '+unwatched+'</span>';
  if(soon)html+='<span>⚡ Soon: '+soon+'</span>';
  if(needsRating)html+='<span style="color:#e24b4a">Needs Rating: '+needsRating+'</span>';
  document.getElementById('statsBar').innerHTML=html;
}

  const isTV=subType==='tv';

  const order=JSON.parse(localStorage.getItem(orderKey)||'[]');
  goat3.sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return(ai>=0?ai:9999)-(bi>=0?bi:9999)});

  let html='<button class="modal-close" onclick="closeReorderModal()">&times;</button>';

}
function closeReorderModal(){document.getElementById('reorderModal').style.display='none'}
function initDragReorder(){
  const list=document.getElementById('reorderList');
  let dragItem=null;
  list.querySelectorAll('.reorder-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragItem=item;item.style.opacity='0.5'});
    item.addEventListener('dragend',e=>{item.style.opacity='1';dragItem=null;updateReorderNumbers()});
    item.addEventListener('dragover',e=>{e.preventDefault()});
    item.addEventListener('dragenter',e=>{e.preventDefault();if(item!==dragItem&&dragItem){const rect=item.getBoundingClientRect();const mid=rect.top+rect.height/2;if(e.clientY<mid){list.insertBefore(dragItem,item)}else{list.insertBefore(dragItem,item.nextSibling)}}});
  });
}
function updateReorderNumbers(){
  const items=document.querySelectorAll('#reorderList .reorder-item');
  items.forEach((item,i)=>{item.querySelector('span').textContent=i+1});
}
function saveReorder(subType){
  const orderKey=subType==='tv'?'goat3OrderTV':'goat3OrderFilm';
  const items=document.querySelectorAll('#reorderList .reorder-item');
  const order=[];
  items.forEach(item=>{order.push(parseInt(item.dataset.id))});
  localStorage.setItem(orderKey,JSON.stringify(order));
  closeReorderModal();
  renderGrid();
}

function renderGrid(){
  if(fetchingCovers)return;
  const filtered=getFiltered();
  const sorted=sortItems(filtered);
  const sort=document.getElementById('sortSelect').value;
  const grid=document.getElementById('grid');
  let html='';
  let lastSection='';
  let sectionIdx=0;

  // Check if all visible are unplayed for delete filtered button
  const allUnplayed=sorted.length>0&&sorted.every(f=>!f.watched&&f.goatTier===0);
  document.getElementById('deleteFiltered').style.display=allUnplayed?'inline-block':'none';
  let goat3Rank=0;

  sorted.forEach(f=>{
    if(sort==='tier'){
      const sec=getTierSection(f);
      let sectionLabel='';
      if(f.goatTier===3){
        const subType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'film';
        const subLabel=subType==='tv'?'All-Time Favourite TV & Comedy':'All-Time Favourite Films';
        sectionLabel='★★★ GOAT — '+subLabel;
      }else{
        sectionLabel=sec.label;
      }
      if(sectionLabel!==lastSection){
        if(lastSection!=='')html+='</div>';
        sectionIdx++;
        const collapsed=collapsedSections.has(sectionLabel);
        const isGoat3=f.goatTier===3;
        const subType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'film';
        const reorderBtn=isGoat3?'<button style="float:right;font-size:9px;padding:2px 8px;background:#333;border:1px solid #555;border-radius:4px;color:#ccc;cursor:pointer" onclick="event.stopPropagation();openReorderModal(\\''+subType+'\\')">↕ Reorder</button>':'';
        html+='<div class="section-header '+sec.cls+(collapsed?' collapsed':'')+'" onclick="toggleSection(this,\\'sec'+sectionIdx+'\\',\\''+sectionLabel.replace(/'/g,"")+'\\')"><span class="collapse-icon">▼</span> '+sectionLabel+reorderBtn+'</div>';
        html+='<div class="section-tiles'+(collapsed?' hidden':'')+'" id="sec'+sectionIdx+'">';
        lastSection=sectionLabel;
        goat3Rank=0;
      }
    }
    if(f.goatTier===3)goat3Rank++;
    html+=renderTile(f,f.goatTier===3?goat3Rank:0);
  });
  if(lastSection!=='')html+='</div>';
  grid.innerHTML=html;
  document.getElementById('itemCount').textContent=sorted.length+' items';
  populatePersonFilters();
  updateStats();
}

const collapsedSections=new Set();
function toggleSection(header,secId,label){
  header.classList.toggle('collapsed');
  const tiles=document.getElementById(secId);
  tiles.classList.toggle('hidden');
  if(header.classList.contains('collapsed'))collapsedSections.add(label);
  else collapsedSections.delete(label);
}

function renderTile(f,rank){
  const poster=posters[f.id];
  const watchCount=getWatchCount(f);
  let imgHtml=poster?'<img class="tile-img" src="'+poster+'" alt="'+f.title+'" loading="lazy">':'<div class="tile-placeholder">'+f.title+'</div>';
  let badges='';
  // GOAT banner with rank
  if(f.goatTier>0){
    const rankStr=(f.goatTier===3&&rank)?'<span style="position:absolute;top:-4px;right:-4px;width:28px;height:28px;background:#fff;color:#e24b4a;font-size:13px;font-weight:900;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid #e24b4a">'+rank+'</span>':'';
    badges+=rankStr;
    badges+='<div class="goat-banner">'+'★'.repeat(f.goatTier)+' GOAT</div>';
  }
  // Rating pill
  if(f.goatTier===0&&f.rating)badges+='<span class="rating-pill '+f.rating+'">'+RATING_LABELS[f.rating]+'</span>';
  else if(f.watched&&!f.rating&&f.goatTier===0)badges+='<span class="rating-pill rateme">Rate Me</span>';
  // Watch count
  if(watchCount>1)badges+='<span class="play-badge">'+watchCount+'×</span>';
  // Soon
  if(f.watchSoon)badges+='<span class="soon-badge">⚡</span>';
  // IMDB score
  if(f.imdbRating)badges+='<span class="score-badge">'+f.imdbRating+'</span>';
  // Press/critic flag — hardcoded list + live verified data
  const pressKey=normalize(f.title);
  const pressEntry=PRESS_RATINGS[pressKey];
  const hasEmpire5=f.empire5;
  const hasTF5=f.totalFilm5;
  const hasRT90=f.rt90;
  if(pressEntry||hasEmpire5||hasTF5||hasRT90){
    let src='';
    if(hasEmpire5&&hasTF5)src='Empire & Total Film 5★';
    else if(hasEmpire5)src='Empire 5★';
    else if(hasTF5)src='Total Film 5★';
    else if(hasRT90)src='RT '+f.rtScore+'%';
    else if(pressEntry==='B')src='Empire & Total Film 5★';
    else if(pressEntry==='E')src='Empire 5★';
    else if(pressEntry==='T')src='Total Film 5★';
    else if(pressEntry==='R')src='RT 90%+';
    else src='5★';
    badges+='<span class="press-flag" title="'+src+'">★★★★★</span>';
  }
  // High IMDB flag
  if(parseFloat(f.imdbRating)>=8.5)badges+='<span class="imdb-flag" title="IMDB 8.5+">🏆</span>';
  // Status dot
  if(f.posterConfirmed)badges+='<span class="status-dot confirmed" style="top:auto;bottom:4px;left:4px"></span>';
  if(f.posterWrong)badges+='<span class="status-dot wrong" style="top:auto;bottom:4px;left:4px"></span>';
  // Type badge
  if(f.mediaType!=='film'){const mt=MEDIA_TYPES.find(m=>m.k===f.mediaType);if(mt)badges+='<span class="type-badge">'+mt.l+'</span>'}
  // Katie watched badge
  if(f.watchedWithKatie)badges+='<span style="position:absolute;bottom:38px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;color:#16a34a;text-shadow:0 0 4px rgba(0,0,0,0.8);z-index:2">K</span>';
  // Streaming badge
  if(f.streamingOn)badges+='<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,.8);color:#4af;font-size:8px;padding:2px 5px;border-radius:3px;z-index:4">▶</span>';
  // Delete mode checkbox
  let checkbox='';
  if(deleteMode)checkbox='<input type="checkbox" style="position:absolute;top:6px;left:6px;z-index:5" '+(selectedIds.has(f.id)?'checked':'')+' onclick="event.stopPropagation();toggleSelect('+f.id+')">';

  const selected=deleteMode&&selectedIds.has(f.id)?' selected':'';
  return '<div class="tile'+selected+'" onclick="'+(deleteMode?'toggleSelect('+f.id+')':'openTileModal('+f.id+')')+'">'+
    '<div class="tile-img-wrap">'+imgHtml+badges+checkbox+'</div>'+
    '<div class="tile-info"><div class="tile-title">'+f.title+'</div><div class="tile-year">'+(f.year||'')+'</div>'+
    '<div class="tile-genre">'+(f.category||'')+'</div>'+
    '<button class="log-btn" onclick="event.stopPropagation();openLogModal('+f.id+')">Log Watch</button>'+
    '</div></div>';
}

async function fetchDetails(id){
  const f=films.find(x=>x.id===id);if(!f)return;
  const box=document.getElementById('detailsBox');
  box.style.display='block';
  box.textContent='Loading...';
  try{
    const searchType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
    let tmdbId=f.tmdbId;
    if(!tmdbId){
      const url='https://api.themoviedb.org/3/search/'+searchType+'?query='+encodeURIComponent(f.title)+(f.year?'&year='+f.year:'');
      const resp=await fetch(url,{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
      const data=await resp.json();
      if(data.results&&data.results.length>0)tmdbId=data.results[0].id;
    }
    if(tmdbId){
      const detail=await(await fetch('https://api.themoviedb.org/3/'+searchType+'/'+tmdbId,{headers:{Authorization:'Bearer '+TMDB_TOKEN}})).json();
      box.textContent=detail.overview||'No description available.';
    }else{box.textContent='Could not find on TMDB.'}
  }catch(e){box.textContent='Error fetching details.'}
}

async function fetchScreenshot(tmdbId,mediaType){
  try{
    const searchType=(mediaType==='tv'||mediaType==='comedy')?'tv':'movie';
    const resp=await fetch('https://api.themoviedb.org/3/'+searchType+'/'+tmdbId+'/images?include_image_language=en,null',{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
    const data=await resp.json();
    const backdrops=data.backdrops||[];
    if(backdrops.length>0){
      const img=backdrops[0];
      const box=document.getElementById('screenshotBox');
      if(box)box.innerHTML='<img src="https://image.tmdb.org/t/p/w780'+img.file_path+'" style="width:100%;border-radius:6px">';
    }
  }catch(e){}
}

async function fetchSimilar(id){
  const f=films.find(x=>x.id===id);if(!f)return;
  const box=document.getElementById('detailsBox');
  box.style.display='block';
  box.innerHTML='<span style="color:#888">Loading similar titles...</span>';
  try{
    const searchType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
    let tmdbId=f.tmdbId;
    if(!tmdbId){
      const url='https://api.themoviedb.org/3/search/'+searchType+'?query='+encodeURIComponent(f.title)+(f.year?'&year='+f.year:'');
      const resp=await fetch(url,{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
      const data=await resp.json();
      if(data.results&&data.results.length>0)tmdbId=data.results[0].id;
    }
    if(!tmdbId){box.textContent='Could not find on TMDB.';return}
    const resp=await fetch('https://api.themoviedb.org/3/'+searchType+'/'+tmdbId+'/recommendations?page=1',{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
    const data=await resp.json();
    const results=(data.results||[]).slice(0,10);
    if(results.length===0){box.textContent='No similar titles found.';return}
    const existing=new Set(films.map(x=>normalize(x.title)));
    let html='<div style="font-size:12px;font-weight:bold;color:#c8a400;margin-bottom:8px">Similar to '+f.title+':</div>';
    results.forEach(r=>{
      const title=r.title||r.name||'';
      const year=(r.release_date||r.first_air_date||'').substring(0,4);
      const poster=r.poster_path?'https://image.tmdb.org/t/p/w92'+r.poster_path:'';
      const score=r.vote_average?r.vote_average.toFixed(1):'';
      const inLib=existing.has(normalize(title));
      html+='<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #222;align-items:center">';
      if(poster)html+='<img src="'+poster+'" style="width:30px;height:45px;object-fit:cover;border-radius:3px">';
      html+='<div style="flex:1"><div style="font-size:11px;font-weight:600">'+title+' <span style="color:#888">('+ year+')</span></div>';
      if(score)html+='<span style="font-size:10px;color:#c8a400">★ '+score+'</span>';
      html+='</div>';
      if(inLib)html+='<span style="font-size:9px;color:#888">In library</span>';
      else html+='<button onclick="addFromSimilar(\\''+title.replace(/'/g,"\\\\'")+'\\',' +year+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">+ Add</button>';
      html+='</div>';
    });
    box.innerHTML=html;
  }catch(e){box.textContent='Error fetching similar titles.'}
}

function addFromSimilar(title,year){
  const existing=new Set(films.map(x=>normalize(x.title)));
  if(existing.has(normalize(title)))return;
  maxId++;
  const nf=makeFilm(title,maxId);
  nf.year=year||0;
  nf.watchSoon=true;
  films.push(nf);
  save();
  fetchMetadataForFilm(nf,'');
  // Update the button to show "In library"
  event.target.outerHTML='<span style="font-size:9px;color:#888">In library ✓</span>';
}

function closeLogModal(){document.getElementById('logModal').style.display='none'}
function saveLog(id){
  const f=films.find(x=>x.id===id);if(!f)return;
  const est=parseInt(document.getElementById('logEstimate').value);
  if(est>0){
    f.watchHistory=(f.watchHistory||[]).filter(w=>!w.historical);
    for(let i=0;i<est;i++)f.watchHistory.push({date:'',rating:'',moods:[],notes:'',historical:true});
  }
  const date=document.getElementById('logDate').value;
  if(date){
    const rating=document.getElementById('logRating').value;
    const moods=[...document.querySelectorAll('.logMood:checked')].map(c=>c.value);
    const notes=document.getElementById('logNotes').value;
    f.watchHistory.push({date,rating,moods,notes,historical:false});
    f.watched=true;f.watchSoon=false;
  }
  save();closeLogModal();renderGrid();
}

async function getSuggestions(){
  const mood=document.getElementById('suggestMood').value;
  const goats=films.filter(f=>f.goatTier>0).map(f=>f.title+' ('+f.year+')').slice(0,15);
  const amazings=films.filter(f=>f.rating==='amazing').map(f=>f.title+' ('+f.year+')').slice(0,10);
  const existing=films.map(f=>f.title.toLowerCase());
  const prompt='I love these films (my all-time favourites): '+goats.join(', ')+'. I also rate these highly: '+amazings.join(', ')+'. '+(mood?'I am in the mood for: '+mood+'. ':'')+'Suggest 10 films I might love that are NOT in my list above. Return ONLY a JSON array of objects with keys: title, year, reason (one sentence why I would like it). No other text.';
  document.getElementById('suggestResults').innerHTML='<p style="color:#888">Asking AI...</p>';
  try{
    const resp=await fetch('https://ditw97qgs2.execute-api.eu-north-1.amazonaws.com/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const text=data.choices[0].message.content;
    const match=text.match(/\\[.*\\]/s);
    if(match){
      let suggestions;try{suggestions=JSON.parse(match[0])}catch(pe){try{suggestions=JSON.parse(match[0].split(String.fromCharCode(10)).join(' ').split(String.fromCharCode(13)).join(' '))}catch(pe2){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">AI returned invalid JSON. Try again.</p>';return}}
      let html='';
      suggestions.forEach(s=>{
        const inLib=existing.includes(s.title.toLowerCase());
        html+='<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #222;align-items:center">';
        html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+s.title+' <span style="color:#888">('+s.year+')</span></div>';
        html+='<div style="font-size:10px;color:#888">'+s.reason+'</div></div>';
        if(inLib)html+='<span style="font-size:9px;color:#888">In library</span>';
        else html+='<button class="btn-secondary" onclick="markSoon(\\''+s.title.replace(/'/g,"\\\\'")+'\\')" style="font-size:10px">⚡ Soon</button>';
        html+='</div>';
      });
      document.getElementById('suggestResults').innerHTML=html;
    }else{document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Could not parse AI response.</p>'}
  }catch(e){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Error: '+e.message+'</p>'}
}
function getLocalSuggestions(){
  const loved=films.filter(f=>f.goatTier>0||f.rating==='amazing');
  const genreScores={},dirScores={},decadeScores={};
  loved.forEach(f=>{
    if(f.category)genreScores[f.category]=(genreScores[f.category]||0)+1;
    if(f.director)(f.director).split(',').forEach(d=>{const t=d.trim();if(t)dirScores[t]=(dirScores[t]||0)+1});
    if(f.year){const dec=Math.floor(f.year/10)*10;decadeScores[dec]=(decadeScores[dec]||0)+1}
  });
  const unwatched=films.filter(f=>!f.watched&&f.goatTier===0);
  const scored=unwatched.map(f=>{
    let score=0;
    if(f.category&&genreScores[f.category])score+=genreScores[f.category]*3;
    if(f.director)(f.director).split(',').forEach(d=>{const t=d.trim();if(dirScores[t])score+=dirScores[t]*5});
    if(f.year){const dec=Math.floor(f.year/10)*10;if(decadeScores[dec])score+=decadeScores[dec]}
    if(parseFloat(f.imdbRating)>=8.0)score+=3;
    if(parseFloat(f.imdbRating)>=8.5)score+=3;
    score+=Math.random()*2;
    return{film:f,score};
  }).sort((a,b)=>b.score-a.score).slice(0,10);
  let html='';
  if(scored.length===0){html='<p style="color:#888">No unwatched films to suggest.</p>'}
  else{scored.forEach(s=>{const f=s.film;const poster=posters[f.id];
    html+='<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #222;align-items:center">';
    if(poster)html+='<img src="'+poster+'" style="width:35px;height:52px;object-fit:cover;border-radius:3px">';
    html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+f.title+' <span style="color:#888">('+(f.year||'?')+')</span></div>';
    html+='<div style="font-size:10px;color:#888">'+(f.category||'')+' · '+(f.director||'')+'</div></div>';
    html+='<button class="btn-secondary" onclick="markSoon(\\''+f.title.replace(/'/g,"\\\\'")+'\\')" style="font-size:10px">⚡ Soon</button>';
    html+='</div>'});
  }
  document.getElementById('suggestResults').innerHTML=html;
}
function markSoon(title){
  const f=films.find(x=>x.title.toLowerCase()===title.toLowerCase());
  if(f){f.watchSoon=true;save()}

function renderCharts(){
  const scope=document.getElementById('chartScope').value;
  let pool=films.filter(f=>f.watched||f.goatTier>0);
  if(scope==='goat3')pool=pool.filter(f=>f.goatTier===3);
  else if(scope==='allgoat')pool=pool.filter(f=>f.goatTier>0);
  else if(scope==='goatamazing')pool=pool.filter(f=>f.goatTier>0||f.rating==='amazing');

  // Top directors
  const dirCount={};
  pool.forEach(f=>{(f.director||'').split(',').forEach(d=>{const t=d.trim();if(t)dirCount[t]=(dirCount[t]||0)+1})});
  const topDirs=Object.entries(dirCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxDir=topDirs[0]?topDirs[0][1]:1;

  // Top cast
  const castCount={};
  pool.forEach(f=>{(f.cast||'').split(',').forEach(c=>{const t=c.trim();if(t)castCount[t]=(castCount[t]||0)+1})});
  const topCast=Object.entries(castCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxCast=topCast[0]?topCast[0][1]:1;

  // By decade
  const decadeCount={},decadePlays={};
  pool.forEach(f=>{if(f.year){const d=Math.floor(f.year/10)*10;decadeCount[d]=(decadeCount[d]||0)+1;decadePlays[d]=(decadePlays[d]||0)+getWatchCount(f)}});
  const decades=Object.keys(decadeCount).sort();
  const maxDec=Math.max(...Object.values(decadeCount),1);

  let html='<h3 style="font-size:13px;color:#c8a400;margin:12px 0 6px">Top 10 Directors</h3>';
  topDirs.forEach(([name,count])=>{html+='<div class="chart-bar"><span class="label">'+name+'</span><div class="bar" style="width:'+Math.round(count/maxDir*200)+'px;background:#c8a400"></div><span class="value">'+count+'</span></div>'});

  html+='<h3 style="font-size:13px;color:#2ecc71;margin:12px 0 6px">Top 10 Cast</h3>';
  topCast.forEach(([name,count])=>{html+='<div class="chart-bar"><span class="label">'+name+'</span><div class="bar" style="width:'+Math.round(count/maxCast*200)+'px;background:#2ecc71"></div><span class="value">'+count+'</span></div>'});

  html+='<h3 style="font-size:13px;color:#9b59b6;margin:12px 0 6px">By Decade</h3>';
  decades.forEach(d=>{html+='<div class="chart-bar"><span class="label">'+d+'s</span><div class="bar" style="width:'+Math.round(decadeCount[d]/maxDec*200)+'px;background:#9b59b6"></div><div class="bar" style="width:'+Math.round((decadePlays[d]||0)/maxDec*100)+'px;background:rgba(155,89,182,.3);margin-left:4px"></div><span class="value">'+decadeCount[d]+'</span></div>'});

  document.getElementById('chartContent').innerHTML=html;
}

async function runCategoryAudit(){
  const uncategorised=films.filter(f=>!f.category&&(f.watched||f.goatTier>0));
  document.getElementById('auditProgress').innerHTML='<p>Processing '+uncategorised.length+' uncategorised films...</p>';
  // Batch in groups of 20
  for(let i=0;i<uncategorised.length;i+=20){
    const batch=uncategorised.slice(i,i+20);
    const prompt='Categorise these films into one of: '+GENRES.join(', ')+'. Return JSON object mapping title to category.\\n'+batch.map(f=>f.title).join('\\n');
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'YOUR_CLAUDE_API_KEY','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1024,messages:[{role:'user',content:prompt}]})});
      const data=await resp.json();
      const text=data.content[0].text;
      const match=text.match(/\\{.*\\}/s);
      if(match){
        const mapping=JSON.parse(match[0]);
        Object.entries(mapping).forEach(([title,cat])=>{
          const f=batch.find(x=>x.title.toLowerCase()===title.toLowerCase());
          if(f&&GENRES.includes(cat))f.category=cat;
        });
      }
    }catch(e){console.error(e)}
    document.getElementById('auditProgress').innerHTML='<p>Processed '+(i+batch.length)+'/'+uncategorised.length+'</p>';
  }
  save();renderGrid();
  document.getElementById('auditProgress').innerHTML='<p style="color:#2ecc71">Done! Categories updated.</p>';
}

const STREAMING_IDS={8:'Netflix',9:'Prime',337:'Disney+',350:'Apple TV+'};

async function checkStreaming(f){
  if(!f.tmdbId)return;
  try{
    const searchType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
    const resp=await fetch('https://api.themoviedb.org/3/'+searchType+'/'+f.tmdbId+'/watch/providers',{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
    const data=await resp.json();
    const gb=data.results&&data.results.GB;
    if(!gb||!gb.flatrate){f.streamingOn='';f.streamingChecked=true;return}
    const matches=gb.flatrate.filter(p=>STREAMING_IDS[p.provider_id]).map(p=>STREAMING_IDS[p.provider_id]);
    f.streamingOn=matches.length>0?matches.join(', '):'';
    f.streamingChecked=true;
  }catch(e){f.streamingOn='';f.streamingChecked=true}
}

async function checkAllStreaming(){
  const toCheck=films.filter(f=>!f.streamingChecked);
  if(toCheck.length===0){updateStats();return}
  let done=0;
  for(const f of toCheck){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#378add">▶ Checking streaming... '+done+'/'+toCheck.length+' — '+f.title+'</span>';
    if(!f.tmdbId&&f.title){
      try{
        const searchType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
        const url='https://api.themoviedb.org/3/search/'+searchType+'?query='+encodeURIComponent(f.title)+(f.year?'&year='+f.year:'');
        const sr=await fetch(url,{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
        const sd=await sr.json();
        if(sd.results&&sd.results.length>0)f.tmdbId=sd.results[0].id;
      }catch(e){}
    }
    await checkStreaming(f);
    await new Promise(r=>setTimeout(r,250));
  }
  save();renderGrid();
}

async function recheckAllStreaming(){
  films.forEach(f=>{f.streamingChecked=false;f.streamingOn=''});
  save();await checkAllStreaming();
}

  html+='<label style="font-size:11px;color:#888">From:</label><input id="histFrom" type="date" value="2026-05-28" onchange="renderHistory()" style="width:auto">';
  html+='</div>';
  html+='<div id="histList" style="max-height:60vh;overflow-y:auto"></div>';
  document.getElementById('historyModalContent').innerHTML=html;
  document.getElementById('historyModal').style.display='block';
  renderHistory();
}
function closeHistory(){document.getElementById('historyModal').style.display='none'}
function renderHistory(){
  const search=(document.getElementById('histSearch').value||'').toLowerCase();
  const fromDate=document.getElementById('histFrom').value||'';
  const entries=[];
  films.forEach(f=>{
    (f.watchHistory||[]).filter(w=>!w.historical&&w.date).forEach(w=>{
      if(fromDate&&w.date<fromDate)return;
      entries.push({film:f,watch:w});
    });
  });
  entries.sort((a,b)=>b.watch.date.localeCompare(a.watch.date));
  const filtered=search?entries.filter(e=>e.film.title.toLowerCase().includes(search)||(e.watch.notes||'').toLowerCase().includes(search)):entries;

  let html='<div style="font-size:11px;color:#888;margin-bottom:8px">'+filtered.length+' entries</div>';
  let lastMonth='';
  filtered.forEach((e,idx)=>{
    const month=e.watch.date.substring(0,7);
    if(month!==lastMonth){html+='<h3 style="font-size:12px;color:#c8a400;margin:12px 0 6px;border-bottom:1px solid #333;padding-bottom:4px">'+month+'</h3>';lastMonth=month}
    const poster=posters[e.film.id];
    const rColor=RATING_COLORS[e.watch.rating]||'#888';
    html+='<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1a;align-items:center">';
    if(poster)html+='<img src="'+poster+'" style="width:30px;height:45px;object-fit:cover;border-radius:3px;cursor:pointer" onclick="openTileModal('+e.film.id+')">';
    html+='<div style="flex:1;cursor:pointer" onclick="openTileModal('+e.film.id+')"><div style="font-size:12px;font-weight:600">'+e.film.title+' <span style="color:#888">('+e.film.year+')</span></div>';
    html+='<div style="font-size:10px;color:#888">'+(e.film.director?e.film.director.split(",")[0]:'')+'</div>';
    if(e.watch.rating)html+='<span style="font-size:10px;color:'+rColor+'">'+RATING_LABELS[e.watch.rating]+'</span> ';
    if(e.watch.moods&&e.watch.moods.length)html+='<span style="font-size:9px;color:#666">'+e.watch.moods.join(', ')+'</span>';
    if(e.watch.notes)html+='<div style="font-size:10px;color:#666;margin-top:2px">'+e.watch.notes+'</div>';
    html+='</div><span style="font-size:10px;color:#888;margin-right:6px">'+e.watch.date+'</span>';
    html+='<button onclick="deleteWatch('+e.film.id+',\\''+e.watch.date+'\\')" style="background:none;border:none;color:#e24b4a;cursor:pointer;font-size:12px" title="Delete this watch">✕</button>';
    html+='</div>';
  });
  document.getElementById('histList').innerHTML=html||'<p style="color:#888">No watch history yet.</p>';
}

function deleteWatch(filmId,date){
  const f=films.find(x=>x.id===filmId);if(!f)return;
  const idx=f.watchHistory.findIndex(w=>w.date===date&&!w.historical);
  if(idx>-1){f.watchHistory.splice(idx,1);save();renderHistory()}
}

function openDuplicateFinder(){
  const dupes=[];
  const seen={};
  films.forEach(f=>{
    if(!f.title||!f.title.trim())return;
    const key=f.title.trim().toLowerCase();
    if(seen[key])seen[key].push(f);
    else seen[key]=[f];
  });
  Object.entries(seen).forEach(([key,group])=>{
    if(group.length>1)dupes.push(group);
  });
  let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button>';
  html+='<h2>Duplicate Finder</h2>';
  if(dupes.length===0){html+='<p style="color:#888">No duplicates found.</p>'}
  else{
    html+='<p style="font-size:11px;color:#888;margin-bottom:10px">'+dupes.length+' duplicate groups found. Click Keep to keep that version, others will be deleted.</p>';
    dupes.forEach((group,gi)=>{
      html+='<div style="border:1px solid #333;border-radius:6px;padding:10px;margin-bottom:10px">';
      html+='<div style="font-size:12px;font-weight:bold;margin-bottom:6px;color:#c8a400">'+group[0].title+'</div>';
      group.forEach((f,fi)=>{
        const poster=posters[f.id];
        html+='<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid #222">';
        if(poster)html+='<img src="'+poster+'" style="width:25px;height:38px;object-fit:cover;border-radius:2px">';
        html+='<div style="flex:1;font-size:11px">';
        html+='<span>ID:'+f.id+'</span> · <span>'+(f.year||'?')+'</span> · <span>'+(f.mediaType||'film')+'</span> · <span>'+(f.rating||f.goatTier>0?TIER_LABELS[f.goatTier]:'unrated')+'</span>';
        html+=' · <span>'+(f.director||'no director')+'</span>';
        html+=' · <span>'+getWatchCount(f)+' watches</span>';
        html+='</div>';
        html+='<button onclick="keepDuplicate('+gi+','+fi+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">Keep</button>';
        html+='</div>';
      });
      html+='</div>';
    });
  }
  document.getElementById('ambiguityModalContent').innerHTML=html;
  document.getElementById('ambiguityModal').style.display='block';
  window._dupeGroups=dupes;
}

function keepDuplicate(groupIdx,keepIdx){
  const group=window._dupeGroups[groupIdx];
  group.forEach((f,i)=>{
    if(i!==keepIdx){
      films=films.filter(x=>x.id!==f.id);
      deletedIds.push(f.id);delete posters[f.id];
    }
  });
  save();openDuplicateFinder();renderGrid();
}

// TMDB API
async function fetchMetadataForFilm(f,hint){
  if(!TMDB_TOKEN||TMDB_TOKEN==='YOUR_TMDB_BEARER_TOKEN')return;
  try{
    if(f.tmdbId){
      const endpoint=f.mediaType==='tv'||f.mediaType==='comedy'?'tv':'movie';
      const detail=await(await fetch('https://api.themoviedb.org/3/'+endpoint+'/'+f.tmdbId+'?append_to_response=credits,external_ids,release_dates,content_ratings',{headers:{Authorization:'Bearer '+TMDB_TOKEN}})).json();
      applyTmdbDetail(f,detail,endpoint);return;
    }
    const searchType=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
    const url='https://api.themoviedb.org/3/search/'+searchType+'?query='+encodeURIComponent(f.title)+(f.year?'&year='+f.year:'');
    const resp=await fetch(url,{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
    const data=await resp.json();
    const results=data.results||[];
    if(results.length===0)return;

    // Score results - fetch details for top candidates to check credits
    const candidates=results.slice(0,5);
    const scored=[];
    for(const r of candidates){
      let score=0;
      const rTitle=(r.title||r.name||'').toLowerCase();
      if(normalize(rTitle)===normalize(f.title))score+=10;
      else if(rTitle.includes(f.title.toLowerCase()))score+=5;
      if(f.year&&(r.release_date||r.first_air_date||'').startsWith(String(f.year)))score+=5;
      score+=((r.vote_average||0)/2);
      // If hint provided, fetch credits to check
      if(hint){
        try{
          const detailResp=await fetch('https://api.themoviedb.org/3/'+searchType+'/'+r.id+'?append_to_response=credits',{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
          const det=await detailResp.json();
          const allPeople=[];
          if(det.credits){
            (det.credits.crew||[]).forEach(c=>allPeople.push(c.name.toLowerCase()));
            (det.credits.cast||[]).forEach(c=>allPeople.push(c.name.toLowerCase()));
          }
          if(det.created_by)(det.created_by).forEach(c=>allPeople.push(c.name.toLowerCase()));
          if(allPeople.some(p=>p.includes(hint.toLowerCase())))score+=8;
        }catch(e){}
      }
      scored.push({...r,score});
    }
    scored.sort((a,b)=>b.score-a.score);

    // If top two scores are close, show ambiguity picker (only if not background fetching)
    if(!fetchingCovers&&scored.length>1&&scored[0].score-scored[1].score<3){
      const chosen=await showAmbiguityPicker(scored.slice(0,4),searchType);
      if(chosen){
        const detail=await(await fetch('https://api.themoviedb.org/3/'+searchType+'/'+chosen.id+'?append_to_response=credits,external_ids,release_dates,content_ratings',{headers:{Authorization:'Bearer '+TMDB_TOKEN}})).json();
        applyTmdbDetail(f,detail,searchType);
      }
    }else{
      const best=scored[0];
      const detail=await(await fetch('https://api.themoviedb.org/3/'+searchType+'/'+best.id+'?append_to_response=credits,external_ids,release_dates,content_ratings',{headers:{Authorization:'Bearer '+TMDB_TOKEN}})).json();
      applyTmdbDetail(f,detail,searchType);
    }
  }catch(e){console.error('TMDB fetch error:',e)}
}

function showAmbiguityPicker(options,searchType){
  return new Promise(resolve=>{
    let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button>';
    html+='<h2>Multiple matches found — pick one:</h2>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px">';
    options.forEach((r,i)=>{
      const poster=r.poster_path?'https://image.tmdb.org/t/p/w200'+r.poster_path:'';
      const title=r.title||r.name||'Unknown';
      const year=(r.release_date||r.first_air_date||'').substring(0,4);
      html+='<div style="cursor:pointer;width:120px;text-align:center" onclick="window._ambiguityResolve('+i+')">';
      if(poster)html+='<img src="'+poster+'" style="width:100%;border-radius:4px">';
      else html+='<div style="width:100%;height:160px;background:#222;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666">No poster</div>';
      html+='<div style="font-size:11px;margin-top:4px;color:#eee">'+title+'</div>';
      html+='<div style="font-size:10px;color:#888">'+year+'</div>';
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('ambiguityModalContent').innerHTML=html;
    document.getElementById('ambiguityModal').style.display='block';
    window._ambiguityResolve=function(idx){
      document.getElementById('ambiguityModal').style.display='none';
      resolve(options[idx]);
    };
  });
}

function applyTmdbDetail(f,detail,type){
  f.tmdbId=detail.id;
  f.year=parseInt((detail.release_date||detail.first_air_date||'').substring(0,4))||f.year;
  if(detail.poster_path&&!f.posterConfirmed){
    posters[f.id]='https://image.tmdb.org/t/p/w300'+detail.poster_path;
  }
  if(detail.credits){
    if(type==='movie'){
      const dirs=(detail.credits.crew||[]).filter(c=>c.job==='Director').map(c=>c.name);
      if(dirs.length)f.director=dirs.join(', ');
      const cast=(detail.credits.cast||[]).slice(0,5).map(c=>c.name);
      if(cast.length)f.cast=cast.join(', ');
    }else{
      const creators=(detail.created_by||[]).map(c=>c.name);
      if(creators.length)f.director=creators.join(', ');
      const cast=(detail.credits.cast||[]).slice(0,5).map(c=>c.name);
      if(cast.length)f.cast=cast.join(', ');
    }
  }
  if(detail.runtime)f.runtime=detail.runtime;
  if(detail.episode_run_time&&detail.episode_run_time.length)f.runtime=detail.episode_run_time[0];
  // Certificate from release_dates (GB only)
  if(detail.release_dates&&detail.release_dates.results){
    const gb=detail.release_dates.results.find(r=>r.iso_3166_1==='GB');
    if(gb&&gb.release_dates){
      const cert=gb.release_dates.find(rd=>rd.certification);
      if(cert)f.certificate=cert.certification;
    }
  }
  // Certificate from content_ratings (TV, GB only)
  if(detail.content_ratings&&detail.content_ratings.results){
    const gb=detail.content_ratings.results.find(r=>r.iso_3166_1==='GB');
    if(gb)f.certificate=gb.rating;
  }
  if(detail.vote_average)f.imdbRating=detail.vote_average.toFixed(1);
  if(detail.external_ids&&detail.external_ids.imdb_id)f.imdbId=detail.external_ids.imdb_id;
  f.posterWrong=false;
  save();
}

async function refreshMetadata(id){

  f.posterConfirmed=false;
  await fetchMetadataForFilm(f,'');

}

async function backgroundFetch(){
  const toFetch=films.filter(f=>!posters[f.id]&&!f.posterConfirmed);
  if(toFetch.length===0)return;
  fetchingCovers=true;
  for(const f of toFetch){
    await fetchMetadataForFilm(f,'');
    await new Promise(r=>setTimeout(r,200));
  }
  fetchingCovers=false;
  save();renderGrid();
}

function makeSlug(title){return title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function makeSlugWithThe(title){const s=makeSlug(title);return s.startsWith('the-')?s:'the-'+s}
function makeRTSlug(title){return title.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').replace(/(_s_)/g,'s_')}

async function checkEmpireRating(f){
  const slug=makeSlug(f.title);
  const urls=[slug+'-review',slug.replace(/-the$/,'')+'-review','the-'+slug+'-review'];
  let gotResponse=false;
  for(const u of urls){
    try{
      const resp=await fetch('https://corsproxy.io/?https://www.empireonline.com/movies/reviews/'+u+'/');
      const html=await resp.text();
      if(!html||html.length<1000)continue;
      gotResponse=true;
      const nextData=html.match(/<script id="__NEXT_DATA__"[^>]*>(.*?)<\\/script>/s);
      if(!nextData)continue;
      const data=JSON.parse(nextData[1]);
      const review=data.props?.pageProps?.queryData?.getReviewByFurl;
      if(!review)continue;
      const rating=parseInt(review.rating);
      if(!isNaN(rating)){
        f.empireRating=rating;
        f.empire5=(rating===5);
        f.empireChecked=true;
        return rating;
      }
    }catch(e){}
  }
  if(gotResponse)f.empireChecked=true;
  return null;
}

async function checkTotalFilmRating(f){
  const slug=makeSlug(f.title);
  const urls=[slug, makeSlugWithThe(f.title), slug.replace(/^the-/,'')];
  let gotResponse=false;
  for(const u of urls){
    try{
      const resp=await fetch('https://corsproxy.io/?https://www.totalfilm.com/reviews/'+u);
      const html=await resp.text();
      if(!html||html.length<1000)continue;
      gotResponse=true;
      const ratingMatch=html.match(/"ratingValue"\s*:\s*"?(\d)"?/);
      if(!ratingMatch)continue;
      const rating=parseInt(ratingMatch[1]);
      if(!isNaN(rating)){
        f.totalFilmRating=rating;
        f.totalFilm5=(rating===5);
        f.totalFilmChecked=true;
        return rating;
      }
    }catch(e){}
  }
  if(gotResponse)f.totalFilmChecked=true;
  return null;
}

async function checkRottenTomatoes(f){
  const slug=makeRTSlug(f.title);
  const slugWithThe=f.title.toLowerCase().startsWith('the ')?slug:'the_'+slug;
  const slugNoThe=slug.replace(/^the_/,'');
  const dirSlug=f.director?makeRTSlug(f.director.split(',')[0].trim()+'s '+f.title):'';
  const isTV=(f.mediaType==='tv');
  const movieUrls=[slug, slugWithThe, slugNoThe];
  if(dirSlug&&dirSlug!==slug)movieUrls.push(dirSlug);
  // Try both /m/ (movies) and /tv/ (TV shows) paths
  const paths=isTV?['tv','m']:['m','tv'];
  let gotResponse=false;
  for(const path of paths){
    for(const u of movieUrls){
      try{
        const resp=await fetch('https://corsproxy.io/?https://www.rottentomatoes.com/'+path+'/'+u);
        const html=await resp.text();
        if(!html||html.length<1000)continue;
        gotResponse=true;
        const scoreMatch=html.match(/"criticsScore":\{[^}]*"score":"(\d+)"/);
        if(!scoreMatch)continue;
        const score=parseInt(scoreMatch[1]);
        if(!isNaN(score)){
          f.rtScore=score;
          f.rt90=(score>=90);
          f.rtChecked=true;
          return score;
        }
      }catch(e){}
    }
    if(gotResponse)break;
  }
  if(gotResponse)f.rtChecked=true;
  return null;
}

async function checkEmpireRatings(){
  const toCheck=films.filter(f=>(!f.empireChecked||!f.totalFilmChecked||!f.rtChecked)&&(f.mediaType==='film'||f.mediaType==='tv'));
  if(toCheck.length===0){updateStats();return}
  let done=0;let rateLimited=0;
  for(const f of toCheck){
    if(rateLimited>=3){document.getElementById('statsBar').innerHTML='<span style="color:#e24b4a">Rate limited — try again later ('+done+' checked)</span>';break}
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#c8a400">★ Checking ratings... '+done+'/'+toCheck.length+' — '+f.title+'</span>';
    if(!f.empireChecked){await checkEmpireRating(f);await new Promise(r=>setTimeout(r,1000))}
    if(!f.totalFilmChecked){await checkTotalFilmRating(f);await new Promise(r=>setTimeout(r,1000))}
    if(!f.rtChecked){const result=await checkRottenTomatoes(f);if(result===null&&!f.rtChecked)rateLimited++;else rateLimited=0;await new Promise(r=>setTimeout(r,1000))}
  }
  films.forEach(f=>{
    const key=normalize(f.title);
    if(f.empire5&&f.totalFilm5)PRESS_RATINGS[key]='B';
    else if(f.empire5)PRESS_RATINGS[key]='E';
    else if(f.totalFilm5)PRESS_RATINGS[key]='T';
    else delete PRESS_RATINGS[key];
  });
  save();renderGrid();
}

async function recheckAllEmpire(){
  films.forEach(f=>{f.empireChecked=false;f.totalFilmChecked=false;f.rtChecked=false});
  save();
  await checkEmpireRatings();
}

async function recheckEmpireSingle(id){
  const f=films.find(x=>x.id===id);if(!f)return;
  f.empireChecked=false;f.empire5=false;f.empireRating=null;
  f.totalFilmChecked=false;f.totalFilm5=false;f.totalFilmRating=null;
  f.rtChecked=false;f.rtScore=null;f.rt90=false;
  await checkEmpireRating(f);
  await checkTotalFilmRating(f);
  await checkRottenTomatoes(f);
  const key=normalize(f.title);
  if(f.empire5&&f.totalFilm5)PRESS_RATINGS[key]='B';
  else if(f.empire5)PRESS_RATINGS[key]='E';
  else if(f.totalFilm5)PRESS_RATINGS[key]='T';
  else delete PRESS_RATINGS[key];
  save();renderGrid();openTileModal(id);
}

async function reimportCovers(){
  const toFetch=films.filter(f=>!f.posterConfirmed);
  if(toFetch.length===0)return;
  // Clear non-confirmed posters
  toFetch.forEach(f=>{delete posters[f.id];f.tmdbId=null;f.posterWrong=false});
  save();renderGrid();
  fetchingCovers=true;
  for(const f of toFetch){
    await fetchMetadataForFilm(f,'');
    await new Promise(r=>setTimeout(r,200));
  }
  fetchingCovers=false;
  save();renderGrid();
}

async function fetchCertificates(){
  const validCerts=['U','PG','12','12A','15','18'];
  const toFetch=films.filter(f=>!validCerts.includes(f.certificate));
  if(toFetch.length===0){document.getElementById('statsBar').innerHTML+='<span style="color:#2ecc71"> ✓ All certs fetched</span>';return}
  let done=0;
  for(const f of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#c8a400">📜 Fetching certificates... '+done+'/'+toFetch.length+'</span>';
    try{
      const endpoint=(f.mediaType==='tv'||f.mediaType==='comedy')?'tv':'movie';
      let tmdbId=f.tmdbId;
      if(!tmdbId){
        const searchUrl='https://api.themoviedb.org/3/search/'+endpoint+'?query='+encodeURIComponent(f.title)+(f.year?'&year='+f.year:'');
        const searchResp=await fetch(searchUrl,{headers:{Authorization:'Bearer '+TMDB_TOKEN}});
        const searchData=await searchResp.json();
        if(searchData.results&&searchData.results.length>0){tmdbId=searchData.results[0].id;f.tmdbId=tmdbId}
      }
      if(!tmdbId){await new Promise(r=>setTimeout(r,200));continue}
      const url='https://api.themoviedb.org/3/'+endpoint+'/'+tmdbId+'?append_to_response='+(endpoint==='movie'?'release_dates':'content_ratings');
      const detail=await(await fetch(url,{headers:{Authorization:'Bearer '+TMDB_TOKEN}})).json();
      f.certificate='';
      if(endpoint==='movie'&&detail.release_dates&&detail.release_dates.results){
        // Try GB first, then US, then AU, then any
        const countries=['GB','US','AU','DE','FR'];
        for(const country of countries){
          if(f.certificate)break;
          const region=detail.release_dates.results.find(r=>r.iso_3166_1===country);
          if(region&&region.release_dates){
            for(const rd of region.release_dates){
              if(rd.certification&&rd.certification.trim()){
                f.certificate=(country==='GB')?rd.certification:usToUk(rd.certification);
                break;
              }
            }
          }
        }
      }
      if(endpoint==='tv'&&detail.content_ratings&&detail.content_ratings.results){
        const gb=detail.content_ratings.results.find(r=>r.iso_3166_1==='GB');
        const us=detail.content_ratings.results.find(r=>r.iso_3166_1==='US');
        if(gb&&gb.rating)f.certificate=gb.rating;
        else if(us&&us.rating)f.certificate=usToUk(us.rating);
      }
      if(detail.runtime&&!f.runtime)f.runtime=detail.runtime;
      if(detail.episode_run_time&&detail.episode_run_time.length&&!f.runtime)f.runtime=detail.episode_run_time[0];
    }catch(e){}
    await new Promise(r=>setTimeout(r,200));
  }
  save();renderGrid();
}

function usToUk(cert){
  const map={'G':'U','PG':'PG','PG-13':'12A','R':'15','NC-17':'18','X':'18','TV-Y':'U','TV-Y7':'U','TV-G':'U','TV-PG':'PG','TV-14':'12A','TV-MA':'15','MA15+':'15','M':'12A','MA':'15','R18+':'18','16':'15','12':'12','6':'U','0':'U'};
  return map[cert]||cert;
}

function normalize(t){return (t||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function makeSortTitle(t){return (t||'').toLowerCase().replace(/^(the|a|an)\\s+/,'')}
function makeGame(title,id){return{id,title,addedDate:new Date().toISOString(),sortTitle:makeSortTitle(title),year:0,platform:'pc',consoleFormat:'',category:'',goatTier:0,rating:'',played:false,completed:false,playSoon:false,playHistory:[],vibes:[],notes:'',developer:'',publisher:'',metaRating:'',rawgId:null,coverWrong:false,coverConfirmed:false,needsEstimate:false}}

function save(){
  localStorage.setItem('gt_games',JSON.stringify(games));
  localStorage.setItem('gt_covers',JSON.stringify(covers));
  localStorage.setItem('gt_deleted',JSON.stringify(deletedIds));
  localStorage.setItem('gt_deleted_titles',JSON.stringify(deletedTitles));
  localStorage.setItem('gt_formats',JSON.stringify(customFormats));
}

function load(){
  const saved=localStorage.getItem('gt_games');
  if(saved){games=JSON.parse(saved)}else{games=[...FULL_SEED]}
  const c=localStorage.getItem('gt_covers');
  if(c)covers=JSON.parse(c);else covers={};
  const d=localStorage.getItem('gt_deleted');
  if(d)deletedIds=JSON.parse(d);else deletedIds=[];
  const dt=localStorage.getItem('gt_deleted_titles');
  if(dt)deletedTitles=JSON.parse(dt);else deletedTitles=[];
  const cf=localStorage.getItem('gt_formats');
  if(cf)customFormats=JSON.parse(cf);else customFormats=[];
  const rk=localStorage.getItem('gt_rawg_key');
  if(rk)RAWG_KEY=rk;
}

function runMigrations(){
  games.forEach(g=>{
    if(g.playHistory===undefined)g.playHistory=[];
    if(g.vibes===undefined)g.vibes=[];
    if(g.notes===undefined)g.notes='';
    if(g.coverWrong===undefined)g.coverWrong=false;
    if(g.coverConfirmed===undefined)g.coverConfirmed=false;
    if(g.needsEstimate===undefined)g.needsEstimate=false;
    if(g.playSoon===undefined)g.playSoon=false;
    if(g.completed===undefined)g.completed=false;
    if(g.consoleFormat===undefined)g.consoleFormat='';
    if(g.sortTitle===undefined)g.sortTitle=makeSortTitle(g.title);
    if(g.rawgId===undefined)g.rawgId=null;
    if(g.steamDeck===undefined)g.steamDeck=false;
    if(g.familyPuzzle===undefined)g.familyPuzzle=false;
  });
  // Corruption cleanup
  games.forEach(g=>{
    if(g.rating==='amazing'&&!g.notes&&(!g.vibes||g.vibes.length===0)){
      const realPlays=(g.playHistory||[]).filter(p=>!p.historical&&p.date);
      if(realPlays.length===0){g.rating='';g.played=false;g.completed=false;g.playHistory=[];}
    }
  });
}

function mergeNewList(){
  const existing=new Set(games.map(g=>normalize(g.title)));
  const deleted=new Set(deletedTitles.map(t=>normalize(t)));
  NEWLIST.forEach(title=>{
    const norm=normalize(title);
    if(!existing.has(norm)&&!deleted.has(norm)){
      maxId++;
      games.push(makeGame(title,maxId));
      existing.add(norm);
    }
  });
  // Auto-tag Steam Deck candidates
  const steamDeckTitles=new Set(['prey','cyberpunk2077','skindeep','mosalina','skyrim','theforgottencity','portal','pragmata','undertale','control','halflife2','angelineera','vampiresurvivors','terraria','metalgearsolidvthephantompain','subnautica','pentiment','norco'].map(t=>t.replace(/[^a-z0-9]/g,'')));
  games.forEach(g=>{if(steamDeckTitles.has(normalize(g.title))&&!g.steamDeck)g.steamDeck=true});
}

function updateMaxId(){maxId=games.reduce((m,g)=>Math.max(m,g.id),0)}
function getPlayCount(g){return (g.playHistory||[]).length}

function getAllFormats(){return [...BUILT_IN_FORMATS,...customFormats]}

function getFiltered(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const platform=document.getElementById('platformFilter').value;
  const genre=document.getElementById('genreFilter').value;
  const decade=document.getElementById('decadeFilter').value;
  const rating=document.getElementById('ratingFilter').value;
  const playStatus=document.getElementById('playStatusFilter').value;
  const flag=document.getElementById('flagFilter').value;
  const cover=document.getElementById('coverFilter').value;
  const developer=document.getElementById('developerFilter').value;
  const publisher=document.getElementById('publisherFilter').value;
  const sort=document.getElementById('sortSelect').value;

  return games.filter(g=>{
    if(search&&!g.title.toLowerCase().includes(search)&&!(g.developer||'').toLowerCase().includes(search)&&!(g.publisher||'').toLowerCase().includes(search))return false;
    if(platform&&g.platform!==platform)return false;
    if(genre&&g.category!==genre)return false;
    if(decade){const d=parseInt(decade);if(!g.year||g.year<d||g.year>=d+10)return false}
    // Rating filter - GOAT items never hidden (except in recently added sort which bypasses)
    if(rating&&sort!=='recent'){
      if(rating==='goat'){if(g.goatTier===0)return false}
      else if(rating==='unrated'){if(g.rating!==''||g.goatTier>0)return false;if(!g.played)return false}
      else{if(g.goatTier>0)return true;if(g.rating!==rating)return false}
    }
    // Play status filter
    if(playStatus){
      if(playStatus==='unplayed'){if(g.played||g.goatTier>0)return false}
      else if(playStatus==='played'){if(!g.played&&g.goatTier===0)return false}
      else if(playStatus==='completed'){if(!g.completed)return false}
      else if(playStatus==='playednotcompleted'){if(!g.played||g.completed||g.goatTier>0)return false}
    }
    if(flag==='needsrating'&&!(g.played&&!g.rating&&g.goatTier===0))return false;
    if(flag==='needsestimate'&&!g.needsEstimate)return false;
    if(flag==='soon'&&!g.playSoon)return false;
    if(flag==='new'&&(!g.addedDate||Date.now()-new Date(g.addedDate).getTime()>86400000))return false;
    if(flag==='steamDeck'&&!g.steamDeck)return false;
    if(flag==='familyPuzzle'&&!g.familyPuzzle)return false;
    if(cover==='wrong'&&!g.coverWrong)return false;
    if(cover==='confirmed'&&!g.coverConfirmed)return false;
    if(cover==='unreviewed'&&(g.coverWrong||g.coverConfirmed))return false;
    if(developer&&!(g.developer||'').includes(developer))return false;
    if(publisher&&!(g.publisher||'').includes(publisher))return false;
    return true;
  });
}

function sortItems(items){
  const sort=document.getElementById('sortSelect').value;
  const copy=[...items];
  if(sort==='az')return copy.sort((a,b)=>(a.sortTitle||makeSortTitle(a.title)).localeCompare(b.sortTitle||makeSortTitle(b.title)));
  if(sort==='year')return copy.sort((a,b)=>(b.year||0)-(a.year||0));
  if(sort==='mostplayed')return copy.sort((a,b)=>getPlayCount(b)-getPlayCount(a));
  if(sort==='meta')return copy.sort((a,b)=>(parseInt(b.metaRating)||0)-(parseInt(a.metaRating)||0));
  if(sort==='series'){
    const getFranchise=t=>(t||'').replace(/\\s+(I{1,3}V?|V?I{0,3}|\\d+)\\s*$/i,'').toLowerCase();
    return copy.sort((a,b)=>{const fa=getFranchise(a.title),fb=getFranchise(b.title);if(fa!==fb)return fa.localeCompare(fb);return(a.year||0)-(b.year||0)});
  }
  if(sort==='recent'){
    // Sort within tier sections by highest ID first
    return copy.sort((a,b)=>{
      const tierOrder=t=>t.goatTier>0?4-t.goatTier:t.rating==='amazing'?4:t.rating==='good'?5:t.rating==='meh'?6:t.rating==='dislike'?7:t.rating==='neveragain'?8:t.played?9:10;
      const ta=tierOrder(a),tb=tierOrder(b);
      if(ta!==tb)return ta-tb;
      return b.id-a.id;
    });
  }
  // Default: tier sort
  return copy.sort((a,b)=>{
    const tierOrder=t=>t.goatTier>0?4-t.goatTier:t.rating==='amazing'?4:t.rating==='good'?5:t.rating==='meh'?6:t.rating==='dislike'?7:t.rating==='neveragain'?8:t.played?9:10;
    const ta=tierOrder(a),tb=tierOrder(b);
    if(ta!==tb)return ta-tb;
    return(a.sortTitle||'').localeCompare(b.sortTitle||'');
  });
}

function getTierSection(g){
  if(g.goatTier===3)return{label:'★★★ GOAT — All-Time Favourites',cls:'goat'};
  if(g.goatTier===2)return{label:'★★ GOAT — Absolute Favourites',cls:'goat'};
  if(g.goatTier===1)return{label:'★ GOAT — Favourites',cls:'goat'};
  if(g.rating==='amazing')return{label:'Amazing',cls:'amazing'};
  if(g.rating==='good')return{label:'Good',cls:'good'};
  if(g.rating==='meh')return{label:'Meh',cls:'meh'};
  if(g.rating==='dislike')return{label:"Didn't Like",cls:'dislike'};
  if(g.rating==='neveragain')return{label:'Never Again',cls:'neveragain'};
  if(g.played)return{label:'Unrated',cls:'unrated'};
  return{label:'Unplayed',cls:'unplayed'};
}

function populatePersonFilters(){
  const devSel=document.getElementById('developerFilter');
  const pubSel=document.getElementById('publisherFilter');
  const curDev=devSel.value,curPub=pubSel.value;
  const devs=new Set(),pubs=new Set();
  games.forEach(g=>{
    if(g.developer)(g.developer).split(',').forEach(d=>{const t=d.trim();if(t)devs.add(t)});
    if(g.publisher)(g.publisher).split(',').forEach(p=>{const t=p.trim();if(t)pubs.add(t)});
  });
  devSel.innerHTML='<option value="">All Developers</option>'+[...devs].sort().map(d=>'<option value="'+d+'">'+d+'</option>').join('');
  pubSel.innerHTML='<option value="">All Publishers</option>'+[...pubs].sort().map(p=>'<option value="'+p+'">'+p+'</option>').join('');
  devSel.value=curDev;pubSel.value=curPub;
}

function populateGenreFilter(){
  const sel=document.getElementById('genreFilter');
  sel.innerHTML='<option value="">All Genres</option>'+GENRES.map(g=>'<option value="'+g+'">'+g+'</option>').join('');
}

function populateDecadeFilter(){
  const decades=new Set();
  games.forEach(g=>{if(g.year)decades.add(Math.floor(g.year/10)*10)});
  const sel=document.getElementById('decadeFilter');
  sel.innerHTML='<option value="">All Decades</option>'+[...decades].sort((a,b)=>b-a).map(d=>'<option value="'+d+'">'+d+'s</option>').join('');
}

function updateStats(){
  const total=games.length;
  const played=games.filter(g=>g.played||g.goatTier>0).length;
  const totalPlays=games.reduce((s,g)=>s+getPlayCount(g),0);
  const goats=games.filter(g=>g.goatTier>0).length;
  const amazing=games.filter(g=>g.rating==='amazing').length;
  const completed=games.filter(g=>g.completed).length;
  const unplayed=games.filter(g=>!g.played&&g.goatTier===0).length;
  const soon=games.filter(g=>g.playSoon).length;
  const needsRating=games.filter(g=>g.played&&!g.rating&&g.goatTier===0).length;
  let html='<span>Total: '+total+'</span><span>Played: '+played+'</span><span>Plays: '+totalPlays+'</span>';
  html+='<span>GOAT: '+goats+'</span><span>Amazing: '+amazing+'</span><span>Completed: '+completed+'</span>';
  html+='<span style="cursor:pointer;text-decoration:underline" onclick="document.getElementById(\\'playStatusFilter\\').value=\\'unplayed\\';renderGrid()">Unplayed: '+unplayed+'</span>';
  if(soon)html+='<span>⚡ Soon: '+soon+'</span>';
  if(needsRating)html+='<span style="color:#e24b4a">Needs Rating: '+needsRating+'</span>';
  if(RAWG_KEY===RAWG_KEY_DEFAULT||RAWG_KEY==='YOUR_RAWG_API_KEY')html+='<span style="color:#d85a30;cursor:pointer" onclick="promptRawgKey()">⚠ Set RAWG API Key</span>';
  document.getElementById('statsBar').innerHTML=html;
}

function promptRawgKey(){
  const key=prompt('Enter your RAWG API key (get free at rawg.io/apidocs):');
  if(key){RAWG_KEY=key;localStorage.setItem('gt_rawg_key',key);updateStats()}
}

function renderGrid(){
  if(fetchingCovers)return;
  const filtered=getFiltered();
  const sorted=sortItems(filtered);
  const sort=document.getElementById('sortSelect').value;
  const grid=document.getElementById('grid');
  let html='';
  let lastSection='';
  let sectionIdx=0;

  const allUnplayed=sorted.length>0&&sorted.every(g=>!g.played&&g.goatTier===0);
  document.getElementById('deleteFiltered').style.display=allUnplayed?'inline-block':'none';

  sorted.forEach(g=>{
    if(sort==='tier'||sort==='recent'){
      const sec=getTierSection(g);
      if(sec.label!==lastSection){
        if(lastSection!=='')html+='</div>';
        sectionIdx++;
        const collapsed=collapsedSections.has(sec.label);
        html+='<div class="section-header '+sec.cls+(collapsed?' collapsed':'')+'" onclick="toggleSection(this,\\'sec'+sectionIdx+'\\',\\''+sec.label.replace(/'/g,"")+'\\')"><span class="collapse-icon">▼</span> '+sec.label+'</div>';
        html+='<div class="section-tiles'+(collapsed?' hidden':'')+'" id="sec'+sectionIdx+'">';
        lastSection=sec.label;
      }
    }
    html+=renderTile(g);
  });
  if(lastSection!=='')html+='</div>';
  grid.innerHTML=html;
  document.getElementById('itemCount').textContent=sorted.length+' items';
  populatePersonFilters();
  updateStats();
}

const collapsedSections=new Set();
function toggleSection(header,secId,label){
  header.classList.toggle('collapsed');
  const tiles=document.getElementById(secId);
  tiles.classList.toggle('hidden');
  if(header.classList.contains('collapsed'))collapsedSections.add(label);
  else collapsedSections.delete(label);
}

function renderTile(g){
  const cover=covers[g.id];
  const playCount=getPlayCount(g);
  let imgHtml=cover?'<img class="tile-img" src="'+cover+'" alt="'+g.title+'" loading="lazy">':'<div class="tile-placeholder">'+g.title+'</div>';
  let badges='';
  if(g.goatTier>0)badges+='<div class="goat-banner">'+'★'.repeat(g.goatTier)+' GOAT</div>';
  if(g.goatTier===0&&g.rating)badges+='<span class="rating-pill '+g.rating+'">'+RATING_LABELS[g.rating]+'</span>';
  else if(g.played&&!g.rating&&g.goatTier===0)badges+='<span class="rating-pill rateme">Rate Me</span>';
  if(playCount>1)badges+='<span class="play-badge">'+playCount+'×</span>';
  if(g.playSoon)badges+='<span class="soon-badge">⚡</span>';
  if(g.metaRating)badges+='<span class="score-badge">'+g.metaRating+'</span>';
  if(parseInt(g.metaRating)>=85)badges+='<span style="position:absolute;top:22px;right:4px;font-size:14px;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))">🏆</span>';
  if(g.coverConfirmed)badges+='<span class="status-dot confirmed"></span>';
  if(g.coverWrong)badges+='<span class="status-dot wrong"></span>';
  if(g.platform!=='pc'){const pl=PLATFORMS.find(p=>p.k===g.platform);if(pl)badges+='<span class="platform-badge">'+pl.l+'</span>'}
  let checkbox='';
  if(deleteMode)checkbox='<input type="checkbox" style="position:absolute;top:6px;left:6px;z-index:5" '+(selectedIds.has(g.id)?'checked':'')+' onclick="event.stopPropagation();toggleSelect('+g.id+')">';
  const selected=deleteMode&&selectedIds.has(g.id)?' selected':'';
  return '<div class="tile'+selected+'" onclick="'+(deleteMode?'toggleSelect('+g.id+')':'openTileModal('+g.id+')')+'">'+
    '<div class="tile-img-wrap">'+imgHtml+badges+checkbox+'</div>'+
    '<div class="tile-info"><div class="tile-title">'+g.title+'</div><div class="tile-year">'+(g.year||'')+'</div>'+
    '<div class="tile-genre">'+(g.category||'')+'</div>'+
    '<button class="log-btn" onclick="event.stopPropagation();openLogModal('+g.id+')">Log Play</button>'+
    '</div></div>';
}

async function fetchSimilar(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const box=document.getElementById('detailsBox');
  box.style.display='block';
  box.innerHTML='<span style="color:#888">Loading similar games...</span>';
  try{
    let rawgId=g.rawgId;
    let slug='';
    if(!rawgId){
      const url=getRawgUrl('/games?search='+encodeURIComponent(g.title)+'&page_size=1');
      const resp=await fetch(url);
      const data=await resp.json();
      if(data.results&&data.results.length>0){rawgId=data.results[0].id;slug=data.results[0].slug}
    }
    if(!rawgId){box.textContent='Could not find on RAWG.';return}
    // Try the game-series endpoint first
    let results=[];
    try{
      const resp=await fetch(getRawgUrl('/games/'+rawgId+'/game-series?page_size=10'));
      const data=await resp.json();
      results=(data.results||[]);
    }catch(e){}
    // If no series results, search by same genres/tags
    if(results.length<3){
      const detail=await(await fetch(getRawgUrl('/games/'+rawgId))).json();
      const genres=(detail.genres||[]).map(ge=>ge.id).slice(0,2).join(',');
      if(genres){
        const resp=await fetch(getRawgUrl('/games?genres='+genres+'&page_size=10&ordering=-metacritic&exclude_additions=true'));
        const data=await resp.json();
        const extra=(data.results||[]).filter(r=>r.id!==rawgId);
        results=[...results,...extra].slice(0,10);
      }
    }
    if(results.length===0){box.textContent='No similar games found.';return}
    const existing=new Set(games.map(x=>normalize(x.title)));
    let html='<div style="font-size:12px;font-weight:bold;color:#2ecc71;margin-bottom:8px">Similar to '+g.title+':</div>';
    results.forEach(r=>{
      const title=r.name||'';
      const year=(r.released||'').substring(0,4);
      const cover=r.background_image||'';
      const score=r.metacritic||'';
      const inLib=existing.has(normalize(title));
      html+='<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #222;align-items:center">';
      if(cover)html+='<img src="'+cover+'" style="width:40px;height:30px;object-fit:cover;border-radius:3px">';
      html+='<div style="flex:1"><div style="font-size:11px;font-weight:600">'+title+' <span style="color:#888">('+year+')</span></div>';
      if(score)html+='<span style="font-size:10px;color:#c8a400">MC: '+score+'</span>';
      html+='</div>';
      if(inLib)html+='<span style="font-size:9px;color:#888">In library</span>';
      else html+='<button onclick="addFromSimilar(\\''+title.replace(/'/g,"\\\\'")+'\\',' +year+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">+ Add</button>';
      html+='</div>';
    });
    box.innerHTML=html;
  }catch(e){box.textContent='Error: '+e.message}
}

function addFromSimilar(title,year){
  const existing=new Set(games.map(x=>normalize(x.title)));
  if(existing.has(normalize(title)))return;
  maxId++;
  const ng=makeGame(title,maxId);
  ng.year=year||0;
  ng.playSoon=true;
  games.push(ng);
  save();
  fetchMetadataForGame(ng,'');
  event.target.outerHTML='<span style="font-size:9px;color:#888">In library ✓</span>';
}

  document.getElementById('suggestModalContent').innerHTML=html;
