function closeSuggestions(){document.getElementById('suggestModal').style.display='none'}
async function getSuggestions(){
  const mood=document.getElementById('suggestMood').value;
  const goats=games.filter(g=>g.goatTier>0).map(g=>g.title).slice(0,15);
  const amazings=games.filter(g=>g.rating==='amazing').map(g=>g.title).slice(0,10);
  const prompt='I love these video games: '+goats.join(', ')+'. I also rate these highly: '+amazings.join(', ')+'. '+(mood?'I am in the mood for: '+mood+'. ':'')+'Suggest 10 video games I might love. Return ONLY a JSON array of objects with keys: title, year, reason (one sentence). No other text.';
  document.getElementById('suggestResults').innerHTML='<p style="color:#888">Asking AI...</p>';
  try{
    const resp=await fetch('https://ditw97qgs2.execute-api.eu-north-1.amazonaws.com/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const text=data.choices[0].message.content;
    const match=text.match(/\\[.*\\]/s);
    if(match){
      let suggestions;try{suggestions=JSON.parse(match[0])}catch(pe){try{suggestions=JSON.parse(match[0].split(String.fromCharCode(10)).join(' ').split(String.fromCharCode(13)).join(' '))}catch(pe2){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">AI returned invalid JSON. Try again.</p>';return}}
      const existing=new Set(games.map(g=>normalize(g.title)));
      let html='';
      suggestions.forEach(s=>{
        const exists=existing.has(normalize(s.title));
        html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+s.title+' ('+s.year+')</div><div style="font-size:10px;color:#888">'+s.reason+'</div>'+(exists?'<span style="font-size:9px;color:#888">In library</span>':'')+'</div>';
      });
      document.getElementById('suggestResults').innerHTML=html;
    }else{document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Could not parse AI response.</p>'}
  }catch(e){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Error: '+e.message+'</p>'}
}
function getLocalSuggestions(){
  const loved=games.filter(g=>g.goatTier>0||g.rating==='amazing');
  const genreScores={},devScores={};
  loved.forEach(g=>{if(g.category)genreScores[g.category]=(genreScores[g.category]||0)+1;if(g.developer)(g.developer).split(',').forEach(d=>{const t=d.trim();if(t)devScores[t]=(devScores[t]||0)+1})});
  const unplayed=games.filter(g=>!g.played&&g.goatTier===0);
  const scored=unplayed.map(g=>{let score=0;if(g.category&&genreScores[g.category])score+=genreScores[g.category]*3;if(g.developer)(g.developer).split(',').forEach(d=>{const t=d.trim();if(devScores[t])score+=devScores[t]*5});if(parseInt(g.metaRating)>=85)score+=3;score+=Math.random()*2;return{game:g,score}}).sort((a,b)=>b.score-a.score).slice(0,10);
  let html='';
  if(scored.length===0)html='<p style="color:#888">No unplayed games to suggest.</p>';
  else scored.forEach(s=>{const g=s.game;
    html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+g.title+'</div><div style="font-size:10px;color:#888">'+(g.category||'')+' · '+(g.developer||'')+'</div></div>';
  });
  document.getElementById('suggestResults').innerHTML=html;

  const topPubs=Object.entries(pubCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxPub=topPubs[0]?topPubs[0][1]:1;

async function runCategoryAudit(){
  const uncategorised=games.filter(g=>!g.category&&(g.played||g.goatTier>0));
  document.getElementById('auditProgress').innerHTML='<p>Processing '+uncategorised.length+' uncategorised games...</p>';
  for(let i=0;i<uncategorised.length;i+=20){
    const batch=uncategorised.slice(i,i+20);
    const prompt='Categorise these games into one of: '+GENRES.join(', ')+'. Return JSON object mapping title to category.\\n'+batch.map(g=>g.title).join('\\n');
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'YOUR_CLAUDE_API_KEY','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1024,messages:[{role:'user',content:prompt}]})});
      const data=await resp.json();
      const text=data.content[0].text;
      const match=text.match(/\\{.*\\}/s);
      if(match){
        const mapping=JSON.parse(match[0]);
        Object.entries(mapping).forEach(([title,cat])=>{
          const g=batch.find(x=>x.title.toLowerCase()===title.toLowerCase());
          if(g&&GENRES.includes(cat))g.category=cat;
        });
      }
    }catch(e){console.error(e)}
    document.getElementById('auditProgress').innerHTML='<p>Processed '+(i+batch.length)+'/'+uncategorised.length+'</p>';
  }
  save();renderGrid();
  document.getElementById('auditProgress').innerHTML='<p style="color:#2ecc71">Done!</p>';
}

function openDuplicateFinder(){
  const dupes=[];
  const seen={};
  games.forEach(g=>{
    if(!g.title||!g.title.trim())return;
    const key=g.title.trim().toLowerCase();
    if(seen[key])seen[key].push(g);
    else seen[key]=[g];
  });
  Object.values(seen).filter(gr=>gr.length>1).forEach(group=>dupes.push(group));
  let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button>';
  html+='<h2>Duplicate Finder</h2>';
  if(dupes.length===0){html+='<p style="color:#888">No duplicates found.</p>'}
  else{
    html+='<p style="font-size:11px;color:#888;margin-bottom:10px">'+dupes.length+' duplicate groups found. Click Keep to keep that version, others will be deleted.</p>';
    dupes.forEach((group,gi)=>{
      html+='<div style="border:1px solid #333;border-radius:6px;padding:10px;margin-bottom:10px">';
      html+='<div style="font-size:12px;font-weight:bold;margin-bottom:6px;color:#2ecc71">'+group[0].title+'</div>';
      group.forEach((g,fi)=>{
        const cover=covers[g.id];
        html+='<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid #222">';
        if(cover)html+='<img src="'+cover+'" style="width:25px;height:38px;object-fit:cover;border-radius:2px">';
        html+='<div style="flex:1;font-size:11px">';
        html+='<span>ID:'+g.id+'</span> · <span>'+(g.year||'?')+'</span> · <span>'+(g.platform||'pc')+'</span> · <span>'+(g.rating||g.goatTier>0?TIER_LABELS[g.goatTier]:'unrated')+'</span>';
        html+=' · <span>'+(g.developer||'no developer')+'</span>';
        html+=' · <span>'+getPlayCount(g)+' plays</span>';
        html+='</div>';
        html+='<button onclick="keepDuplicate('+gi+','+fi+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">Keep</button>';
        html+='</div>';
      });
      html+='</div>';
    });
  }
  document.getElementById('ambiguityModalContent').innerHTML=html;
  document.getElementById('ambiguityModal').style.display='block';
  window._dupeGroups=dupes;
}

function keepDuplicate(groupIdx,keepIdx){
  const group=window._dupeGroups[groupIdx];
  group.forEach((g,i)=>{
    if(i!==keepIdx){
      games=games.filter(x=>x.id!==g.id);
      deletedTitles.push(g.title);deletedIds.push(g.id);delete covers[g.id];
    }
  });
  save();openDuplicateFinder();renderGrid();
}

// RAWG API
function getRawgUrl(path){
  const base='https://api.rawg.io/api';
  const useProxy=window.location.protocol==='file:';
  const url=base+path+(path.includes('?')?'&':'?')+'key='+RAWG_KEY;
  return useProxy?'https://corsproxy.io/?'+encodeURIComponent(url):url;
}

async function fetchMetadataForGame(g,hint){
  if(!RAWG_KEY||RAWG_KEY==='YOUR_RAWG_API_KEY')return;
  try{
    let detail;
    if(g.rawgId){
      detail=await(await fetch(getRawgUrl('/games/'+g.rawgId))).json();
    }else{
      const url=getRawgUrl('/games?search='+encodeURIComponent(g.title)+'&page_size=5');
      const resp=await fetch(url);
      const data=await resp.json();
      const results=data.results||[];
      if(results.length===0)return;
      const scored=results.map(r=>{
        let score=0;
        if(normalize(r.name)===normalize(g.title))score+=10;
        else if(normalize(r.name).includes(normalize(g.title)))score+=5;
        if(g.year&&(r.released||'').startsWith(String(g.year)))score+=5;
        if(hint){
          const devNames=(r.developers||[]).map(d=>d.name.toLowerCase()).join(' ');
          const pubNames=(r.publishers||[]).map(p=>p.name.toLowerCase()).join(' ');
          if(devNames.includes(hint.toLowerCase())||pubNames.includes(hint.toLowerCase()))score+=8;
        }
        score+=(r.metacritic||0)/20;
        return{...r,score};
      }).sort((a,b)=>b.score-a.score);
      detail=await(await fetch(getRawgUrl('/games/'+scored[0].id))).json();
    }
    applyRawgDetail(g,detail);
  }catch(e){console.error('RAWG fetch error:',e)}
}

function applyRawgDetail(g,detail){
  g.rawgId=detail.id;
  g.year=parseInt((detail.released||'').substring(0,4))||g.year;
  if(detail.background_image&&!g.coverConfirmed){covers[g.id]=detail.background_image}
  if(detail.developers&&detail.developers.length)g.developer=detail.developers.map(d=>d.name).join(', ');
  if(detail.publishers&&detail.publishers.length)g.publisher=detail.publishers.map(p=>p.name).join(', ');
  if(detail.metacritic)g.metaRating=String(detail.metacritic);
  if(detail.genres&&detail.genres.length&&!g.category){
    const slug=detail.genres[0].slug;
    if(RAWG_GENRE_MAP[slug])g.category=RAWG_GENRE_MAP[slug];
  }
  g.coverWrong=false;
  save();
}

async function refreshMetadata(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  g.coverConfirmed=false;
  await fetchMetadataForGame(g,'');
  save();openTileModal(id);
}

async function backgroundFetch(){
  const toFetch=games.filter(g=>!covers[g.id]&&!g.coverConfirmed);
  if(toFetch.length===0)return;
  fetchingCovers=true;
  for(const g of toFetch){
    await fetchMetadataForGame(g,'');
    await new Promise(r=>setTimeout(r,200));
  }
  fetchingCovers=false;
  save();renderGrid();
}

async function reimportCovers(){
  const toFetch=games.filter(g=>!g.coverConfirmed);
  if(toFetch.length===0)return;
  // Clear non-confirmed covers
  toFetch.forEach(g=>{delete covers[g.id];g.rawgId=null;g.coverWrong=false});
  save();renderGrid();
  fetchingCovers=true;
  for(const g of toFetch){
    await fetchMetadataForGame(g,'');
    await new Promise(r=>setTimeout(r,200));
  }
  fetchingCovers=false;
  save();renderGrid();
}

let books=[],covers={},deletedIds=[],maxId=0,deleteMode=false,selectedIds=new Set(),fetchingCovers=false;

function normalize(t){return(t||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function makeSortTitle(t){return(t||'').toLowerCase().replace(/^(the|a|an)\\s+/,'')}
function makeBook(title,id){return{id,title,addedDate:new Date().toISOString(),sortTitle:makeSortTitle(title),year:0,author:'',category:'',bookType:'novel',goatTier:0,rating:'',read:false,readSoon:false,readHistory:[],notes:'',pages:0,olid:'',coverConfirmed:false,coverWrong:false}}

function save(){localStorage.setItem('bt_books',JSON.stringify(books));localStorage.setItem('bt_covers',JSON.stringify(covers));localStorage.setItem('bt_deleted',JSON.stringify(deletedIds))}
function load(){
  const s=localStorage.getItem('bt_books');if(s)books=JSON.parse(s);else books=[...FULL_SEED];
  const c=localStorage.getItem('bt_covers');if(c)covers=JSON.parse(c);else covers={};
  const d=localStorage.getItem('bt_deleted');if(d)deletedIds=JSON.parse(d);else deletedIds=[];
}
function runMigrations(){books.forEach(b=>{if(b.readHistory===undefined)b.readHistory=[];if(b.readSoon===undefined)b.readSoon=false;if(b.olid===undefined)b.olid='';if(b.coverConfirmed===undefined)b.coverConfirmed=false;if(b.coverWrong===undefined)b.coverWrong=false;if(b.sortTitle===undefined)b.sortTitle=makeSortTitle(b.title);if(b.pages===undefined)b.pages=0;if(b.bookType===undefined)b.bookType='';if(b.bookClub===undefined)b.bookClub=false;if(b.bookClubNominee===undefined)b.bookClubNominee=false;if(b.audiobook===undefined)b.audiobook=false;if(b.score===undefined)b.score=''})}
function updateMaxId(){maxId=books.reduce((m,b)=>Math.max(m,b.id),0)}
function getReadCount(b){return(b.readHistory||[]).length}

function getFiltered(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const type=document.getElementById('typeFilter').value;
  const genre=document.getElementById('genreFilter').value;
  const decade=document.getElementById('decadeFilter').value;
  const rating=document.getElementById('ratingFilter').value;
  const author=document.getElementById('authorFilter').value;
  const tag=document.getElementById('tagFilter').value;
  return books.filter(b=>{
    if(search&&!b.title.toLowerCase().includes(search)&&!(b.author||'').toLowerCase().includes(search))return false;
    if(type){const bt=b.bookType||'novel';if(bt!==type)return false}
    if(genre&&b.category!==genre)return false;
    if(decade){const d=parseInt(decade);if(!b.year||b.year<d||b.year>=d+10)return false}
    if(rating){
      if(rating==='goat'){if(b.goatTier===0)return false}
      else if(rating==='unrated'){if(b.rating!==''||b.goatTier>0)return false;if(!b.read)return false}
      else{if(b.goatTier>0)return true;if(b.rating!==rating)return false}
    }
    if(tag==='bookClub'&&!b.bookClub)return false;
    if(tag==='bookClubNominee'&&!b.bookClubNominee)return false;
    if(tag==='audiobook'&&!b.audiobook)return false;
    if(tag==='soon'&&!b.readSoon)return false;
    if(tag==='new'&&(!b.addedDate||Date.now()-new Date(b.addedDate).getTime()>86400000))return false;
    if(author&&!(b.author||'').includes(author))return false;
    return true;
  });
}
function sortItems(items){
  const sort=document.getElementById('sortSelect').value;
  const copy=[...items];
  if(sort==='az')return copy.sort((a,b)=>(a.sortTitle||'').localeCompare(b.sortTitle||''));
  if(sort==='year')return copy.sort((a,b)=>(b.year||0)-(a.year||0));
  if(sort==='mostread')return copy.sort((a,b)=>getReadCount(b)-getReadCount(a));
  if(sort==='pages')return copy.sort((a,b)=>(b.pages||0)-(a.pages||0));
  return copy.sort((a,b)=>{
    const tierOrder=t=>t.goatTier>0?4-t.goatTier:t.rating==='amazing'?4:t.rating==='good'?5:t.rating==='meh'?6:t.rating==='dislike'?7:t.rating==='neveragain'?8:t.read?9:10;
    const ta=tierOrder(a),tb=tierOrder(b);if(ta!==tb)return ta-tb;
    // Within ★★★ GOAT, group novels first then graphic novels
    if(a.goatTier===3&&b.goatTier===3){
      const aIsGN=(a.bookType==='graphic')?1:0;
      const bIsGN=(b.bookType==='graphic')?1:0;
      if(aIsGN!==bIsGN)return aIsGN-bIsGN;
    }
    return(a.sortTitle||'').localeCompare(b.sortTitle||'');
  });
}
function getTierSection(b){
  if(b.goatTier===3)return{label:'★★★ GOAT — All-Time Favourites',cls:'goat'};
  if(b.goatTier===2)return{label:'★★ GOAT — Absolute Favourites',cls:'goat'};
  if(b.goatTier===1)return{label:'★ GOAT — Favourites',cls:'goat'};
  if(b.rating==='amazing')return{label:'Amazing',cls:'amazing'};
  if(b.rating==='good')return{label:'Good',cls:'good'};
  if(b.rating==='meh')return{label:'Meh',cls:'meh'};
  if(b.rating==='dislike')return{label:"Didn't Like",cls:'dislike'};
  if(b.rating==='neveragain')return{label:'Never Again',cls:'neveragain'};
  if(b.read)return{label:'Unrated',cls:'unrated'};
  return{label:'Unread',cls:'unplayed'};
}

function populateFilters(){
  const authors=new Set();books.forEach(b=>{if(b.author)(b.author).split(',').forEach(a=>{const t=a.trim();if(t)authors.add(t)})});
  const sel=document.getElementById('authorFilter');const cur=sel.value;
  sel.innerHTML='<option value="">All Authors</option>'+[...authors].sort().map(a=>'<option value="'+a+'">'+a+'</option>').join('');sel.value=cur;
  const gSel=document.getElementById('genreFilter');
  gSel.innerHTML='<option value="">All Genres</option>'+ALL_GENRES.map(g=>'<option value="'+g+'">'+g+'</option>').join('');
  const decades=new Set();books.forEach(b=>{if(b.year>0)decades.add(Math.floor(b.year/10)*10)});
  const dSel=document.getElementById('decadeFilter');
  dSel.innerHTML='<option value="">All Decades</option>'+[...decades].sort((a,b)=>b-a).map(d=>'<option value="'+d+'">'+d+'s</option>').join('');
}
function updateStats(){
  const total=books.length,readCount=books.filter(b=>b.read||b.goatTier>0).length;
  const goats=books.filter(b=>b.goatTier>0).length,amazing=books.filter(b=>b.rating==='amazing').length;
  const unread=books.filter(b=>!b.read&&b.goatTier===0).length;
  document.getElementById('statsBar').innerHTML='<span>Total: '+total+'</span><span>Read: '+readCount+'</span><span>GOAT: '+goats+'</span><span>Amazing: '+amazing+'</span><span>Unread: '+unread+'</span>';
}
const collapsedSections=new Set();
function toggleSection(header,secId,label){header.classList.toggle('collapsed');document.getElementById(secId).classList.toggle('hidden');if(header.classList.contains('collapsed'))collapsedSections.add(label);else collapsedSections.delete(label)}

function renderGrid(){
  if(fetchingCovers)return;
  const filtered=getFiltered(),sorted=sortItems(filtered);
  const sort=document.getElementById('sortSelect').value;
  const grid=document.getElementById('grid');let html='',lastSection='',sectionIdx=0;
  sorted.forEach(b=>{
    if(sort==='tier'){
      const sec=getTierSection(b);
      let sectionLabel=sec.label;
      if(b.goatTier===3){
        const subType=(b.bookType==='graphic')?'graphic':'novel';
        sectionLabel=subType==='graphic'?'★★★ GOAT — All-Time Favourite Graphic Novels':'★★★ GOAT — All-Time Favourite Novels';
      }
      if(sectionLabel!==lastSection){
        if(lastSection!=='')html+='</div>';sectionIdx++;
        const collapsed=collapsedSections.has(sectionLabel);
        html+='<div class="section-header '+sec.cls+(collapsed?' collapsed':'')+'" onclick="toggleSection(this,\\'sec'+sectionIdx+'\\',\\''+sectionLabel.replace(/'/g,"")+'\\')"><span class="collapse-icon">▼</span> '+sectionLabel+'</div>';
        html+='<div class="section-tiles'+(collapsed?' hidden':'')+'" id="sec'+sectionIdx+'">';
        lastSection=sectionLabel;
      }
    }
    html+=renderTile(b);
  });
  if(lastSection!=='')html+='</div>';
  grid.innerHTML=html;
  document.getElementById('itemCount').textContent=sorted.length+' items';
  populateFilters();updateStats();
}
function renderTile(b){
  const cover=covers[b.id];const readCount=getReadCount(b);
  let imgHtml=cover?'<img class="tile-img" src="'+cover+'" alt="'+b.title+'" loading="lazy">':'<div class="tile-placeholder">'+b.title+'</div>';
  let badges='';
  if(b.goatTier>0)badges+='<div class="goat-banner">'+'★'.repeat(b.goatTier)+' GOAT</div>';
  if(b.goatTier===0&&b.rating)badges+='<span class="rating-pill '+b.rating+'">'+RATING_LABELS[b.rating]+'</span>';
  else if(b.read&&!b.rating&&b.goatTier===0)badges+='<span class="rating-pill rateme">Rate Me</span>';
  if(readCount>1)badges+='<span class="read-badge">'+readCount+'×</span>';
  if(b.readSoon)badges+='<span class="soon-badge">⚡</span>';
  if(b.score)badges+='<span class="score-badge">'+b.score+'</span>';
  const selected=deleteMode&&selectedIds.has(b.id)?' selected':'';
  let checkbox='';if(deleteMode)checkbox='<input type="checkbox" style="position:absolute;top:6px;left:6px;z-index:5" '+(selectedIds.has(b.id)?'checked':'')+' onclick="event.stopPropagation();toggleSelect('+b.id+')">';
  return '<div class="tile'+selected+'" onclick="'+(deleteMode?'toggleSelect('+b.id+')':'openTileModal('+b.id+')')+'"><div class="tile-img-wrap">'+imgHtml+badges+checkbox+'</div><div class="tile-info"><div class="tile-title">'+b.title+'</div><div class="tile-year">'+(b.author||'')+'</div><div class="tile-genre">'+(b.category||'')+'</div></div></div>';
}

function openTileModal(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  const cover=covers[b.id]||'';
  let html='<button class="modal-close" onclick="closeTileModal()">&times;</button>';
  html+='<div style="display:flex;gap:12px;align-items:flex-start">';
  if(cover)html+='<img src="'+cover+'" style="width:80px;border-radius:4px">';
  html+='<div><h2>'+b.title+'</h2>';
  html+='<div style="font-size:11px;color:#888;margin:4px 0">';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="openFixModal('+b.id+')">✎ Fix</button>';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="refreshMetadata('+b.id+')">⟳ Refresh</button>';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="fetchDetails('+b.id+')">📋 Details</button>';

  html+='</div>';
  html+='<div style="font-size:12px;color:#aaa;margin-top:4px">'+(b.author||'Unknown')+' · '+(b.year||'')+'</div>';
  html+='</div></div>';
  html+='<div id="detailsBox" style="display:none;background:#0f0f0f;border-radius:6px;padding:10px;margin:10px 0;font-size:12px;color:#ccc;line-height:1.5"></div>';
  html+='<div class="metadata-card"><div><strong>Author:</strong> '+(b.author||'N/A')+'</div><div><strong>Year:</strong> '+(b.year||'N/A')+'</div><div><strong>Pages:</strong> '+(b.pages||'N/A')+'</div><div><strong>Genre:</strong> '+(b.category||'N/A')+'</div><div><strong>Notes:</strong> '+(b.notes||'—')+'</div></div>';

  html+='</div>';

  html+='<button class="'+((b.bookType||'novel')==='novel'?'active':'')+'" onclick="setBookType('+b.id+',\\'novel\\')">📖 Novel</button>';
  html+='<button class="'+((b.bookType)==='graphic'?'active':'')+'" onclick="setBookType('+b.id+',\\'graphic\\')">🎨 Graphic Novel</button>';
  html+='<button class="'+((b.bookType)==='nonfiction'?'active':'')+'" onclick="setBookType('+b.id+',\\'nonfiction\\')">📘 Non-Fiction</button>';
  html+='<button class="'+((b.bookType)==='short'?'active':'')+'" onclick="setBookType('+b.id+',\\'short\\')">📄 Short Stories</button>';
  html+='</div>';

  const genreList=getGenresForType(b.bookType||'novel');

  html+='<label>Read ('+getReadCount(b)+' times)</label>';

async function fetchDetails(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  const box=document.getElementById('detailsBox');box.style.display='block';box.textContent='Loading...';
  try{
    const resp=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(b.title+' '+b.author)+'&limit=1');
    const data=await resp.json();
    if(data.docs&&data.docs.length>0){const doc=data.docs[0];
      const key=doc.key;
      const workResp=await fetch('https://openlibrary.org'+key+'.json');
      const work=await workResp.json();
      const desc=work.description?(typeof work.description==='string'?work.description:work.description.value):'No description available.';
      box.textContent=desc;
    }else{box.textContent='Not found on Open Library.'}
  }catch(e){box.textContent='Error fetching details.'}
}

function setGenre(id,genre){const b=books.find(x=>x.id===id);if(!b)return;b.category=genre;save();openTileModal(id)}
function setBookType(id,type){const b=books.find(x=>x.id===id);if(!b)return;b.bookType=type;save();openTileModal(id)}
function toggleSoon(id,val){const b=books.find(x=>x.id===id);if(!b)return;b.readSoon=val;save()}
function toggleRead(id,val){const b=books.find(x=>x.id===id);if(!b)return;b.read=val;save()}

async function saveFixModal(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  b.title=document.getElementById('fixTitle').value;b.sortTitle=makeSortTitle(b.title);
  b.author=document.getElementById('fixAuthor').value;
  b.year=parseInt(document.getElementById('fixYear').value)||0;
  b.pages=parseInt(document.getElementById('fixPages').value)||0;
  b.bookType=document.getElementById('fixType').value;
  const genre=document.getElementById('fixGenre').value;if(genre)b.category=genre;

async function fetchByIsbn(b,isbn){
  try{
    const resp=await fetch('https://openlibrary.org/isbn/'+isbn+'.json');
    if(resp.ok){
      const data=await resp.json();
      if(data.title)b.title=data.title;
      if(data.number_of_pages)b.pages=data.number_of_pages;
      if(data.publish_date){const y=parseInt(data.publish_date.match(/\\d{4}/));if(y)b.year=y}
      if(data.covers&&data.covers.length>0){covers[b.id]='https://covers.openlibrary.org/b/id/'+data.covers[0]+'-M.jpg'}
      else{covers[b.id]='https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg'}
      if(data.works&&data.works.length>0){
        const workKey=data.works[0].key;
        const workResp=await fetch('https://openlibrary.org'+workKey+'.json');
        const work=await workResp.json();
        if(work.authors&&work.authors.length>0){
          const authorKey=work.authors[0].author?work.authors[0].author.key:work.authors[0].key;
          if(authorKey){const aResp=await fetch('https://openlibrary.org'+authorKey+'.json');const aData=await aResp.json();if(aData.name)b.author=aData.name}
        }
      }
      b.sortTitle=makeSortTitle(b.title);
      return;
    }
    // Fallback to Google Books if Open Library doesn't have the ISBN
    await fetchByIsbnGoogle(b,isbn);
  }catch(e){console.error('ISBN fetch error:',e);await fetchByIsbnGoogle(b,isbn).catch(()=>{})}
}

async function fetchByIsbnGoogle(b,isbn){
  try{
    const resp=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);
    if(!resp.ok)return;
    const data=await resp.json();
    if(!data.items||data.items.length===0)return;
    const vol=data.items[0].volumeInfo;
    if(vol.title)b.title=vol.title;
    if(vol.authors&&vol.authors.length>0)b.author=vol.authors.join(', ');
    if(vol.publishedDate){const y=parseInt(vol.publishedDate);if(y)b.year=y}
    if(vol.pageCount)b.pages=vol.pageCount;
    if(vol.imageLinks){covers[b.id]=vol.imageLinks.thumbnail?vol.imageLinks.thumbnail.replace('http:','https:'):''}
    if(vol.categories&&vol.categories.length>0&&!b.category){
      const cat=vol.categories[0];
      const match=ALL_GENRES.find(g=>cat.toLowerCase().includes(g.toLowerCase()));
      if(match)b.category=match;
    }
    b.sortTitle=makeSortTitle(b.title);
  }catch(e){console.error('Google Books fallback error:',e)}
}

function openBulkAdd(){
  let html='<button class="modal-close" onclick="closeBulkAdd()">&times;</button><h2>Bulk Add Books</h2>';
  html+='<label>Paste titles (one per line, optionally "Title - Author")</label><textarea id="bulkTitles" style="min-height:120px;font-family:monospace" rows="8"></textarea>';
  html+='<div id="bulkPreview" style="margin:10px 0;font-size:11px"></div>';
  html+='<div class="modal-actions"><button class="btn-secondary" onclick="previewBulk()">Preview</button><button class="btn-primary" onclick="confirmBulk()">Add All</button><button class="btn-secondary" onclick="closeBulkAdd()">Cancel</button></div>';
  document.getElementById('bulkModalContent').innerHTML=html;document.getElementById('bulkModal').style.display='block';
}
function closeBulkAdd(){document.getElementById('bulkModal').style.display='none'}
function previewBulk(){
  const lines=document.getElementById('bulkTitles').value.split(String.fromCharCode(10)).map(t=>t.trim()).filter(Boolean);
  const existing=new Set(books.map(b=>normalize(b.title)));
  let html='',newC=0,dupeC=0;
  lines.forEach(l=>{const title=l.split(' - ')[0].trim();if(existing.has(normalize(title))){html+='<div style="color:#e24b4a">✗ '+l+'</div>';dupeC++}else{html+='<div style="color:#2ecc71">✓ '+l+'</div>';newC++}});
  document.getElementById('bulkPreview').innerHTML='<strong>'+newC+' new</strong>, '+dupeC+' duplicates<br>'+html;
}
function confirmBulk(){
  const lines=document.getElementById('bulkTitles').value.split(String.fromCharCode(10)).map(t=>t.trim()).filter(Boolean);
  const existing=new Set(books.map(b=>normalize(b.title)));let added=0;
  lines.forEach(l=>{const parts=l.split(' - ');const title=parts[0].trim();const author=(parts[1]||'').trim();
    if(!existing.has(normalize(title))){maxId++;const nb=makeBook(title,maxId);nb.author=author;books.push(nb);existing.add(normalize(title));added++}
  });
  save();closeBulkAdd();document.getElementById('searchBox').value='';renderGrid();
  setTimeout(()=>backgroundFetch(),500);
}

// Suggestions
function openSuggestions(){
  let html='<button class="modal-close" onclick="closeSuggestions()">&times;</button><h2>✨ AI Suggestions</h2>';
  html+='<label>Preference (optional)</label><input id="suggestMood" placeholder="e.g. dark literary fiction, sci-fi, memoir">';
  html+='<div class="modal-actions"><button class="btn-primary" onclick="getSuggestions()">Get AI Suggestions</button><button class="btn-secondary" onclick="getLocalSuggestions()">Quick Suggest</button></div>';
  html+='<div id="suggestResults" style="margin-top:12px"></div>';
  document.getElementById('suggestModalContent').innerHTML=html;document.getElementById('suggestModal').style.display='block';
}
function closeSuggestions(){document.getElementById('suggestModal').style.display='none'}
async function getSuggestions(){
  const mood=document.getElementById('suggestMood').value;
  const goats=books.filter(b=>b.goatTier>0).map(b=>b.title+' by '+b.author).slice(0,15);
  const amazings=books.filter(b=>b.rating==='amazing').map(b=>b.title+' by '+b.author).slice(0,10);
  const prompt='I love these books: '+goats.join(', ')+'. I also rate these highly: '+amazings.join(', ')+'. '+(mood?'I am in the mood for: '+mood+'. ':'')+'Suggest 10 books I might love. Return ONLY a JSON array of objects with keys: title, author, year, reason (one sentence). No other text.';
  document.getElementById('suggestResults').innerHTML='<p style="color:#888">Asking AI...</p>';
  try{
    const resp=await fetch('https://ditw97qgs2.execute-api.eu-north-1.amazonaws.com/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const text=data.choices[0].message.content;
    const match=text.match(/\\[.*\\]/s);
    if(match){
      let suggestions;try{suggestions=JSON.parse(match[0])}catch(pe){try{suggestions=JSON.parse(match[0].split(String.fromCharCode(10)).join(' ').split(String.fromCharCode(13)).join(' '))}catch(pe2){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">AI returned invalid JSON. Try again.</p>';return}}
      const existing=new Set(books.map(b=>normalize(b.title)));
      let html='';
      suggestions.forEach(s=>{
        const inLib=existing.has(normalize(s.title));
        html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+s.title+' <span style="color:#888">by '+s.author+' ('+s.year+')</span></div><div style="font-size:10px;color:#888">'+s.reason+'</div>'+(inLib?'<span style="font-size:9px;color:#888">In library</span>':'')+'</div>';
      });
      document.getElementById('suggestResults').innerHTML=html;
    }else{document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Could not parse AI response.</p>'}
  }catch(e){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Error: '+e.message+'</p>'}
}
function getLocalSuggestions(){
  const loved=books.filter(b=>b.goatTier>0||b.rating==='amazing');
  const genreScores={},authorScores={};
  loved.forEach(b=>{if(b.category)genreScores[b.category]=(genreScores[b.category]||0)+1;if(b.author)(b.author).split(',').forEach(a=>{const t=a.trim();if(t)authorScores[t]=(authorScores[t]||0)+1})});
  const unread=books.filter(b=>!b.read&&b.goatTier===0);
  const scored=unread.map(b=>{let score=0;if(b.category&&genreScores[b.category])score+=genreScores[b.category]*3;if(b.author)(b.author).split(',').forEach(a=>{const t=a.trim();if(authorScores[t])score+=authorScores[t]*5});score+=Math.random()*2;return{book:b,score}}).sort((a,b)=>b.score-a.score).slice(0,10);
  let html='';
  if(scored.length===0)html='<p style="color:#888">No unread books to suggest.</p>';
  else scored.forEach(s=>{const b=s.book;
    html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+b.title+'</div><div style="font-size:10px;color:#888">'+b.author+' · '+(b.category||'')+'</div></div>';
  });
  document.getElementById('suggestResults').innerHTML=html;
}

function openHistory(){
  let html='<button class="modal-close" onclick="closeHistory()">&times;</button><h2>📅 Reading History</h2>';
  html+='<input id="histSearch" type="text" placeholder="Search..." oninput="renderHistory()" style="margin-bottom:10px">';

  document.getElementById('historyModalContent').innerHTML=html;document.getElementById('historyModal').style.display='block';renderHistory();
}
function closeHistory(){document.getElementById('historyModal').style.display='none'}
function renderHistory(){
  const search=(document.getElementById('histSearch').value||'').toLowerCase();
  const entries=[];books.forEach(b=>{(b.readHistory||[]).filter(r=>r.date).forEach(r=>{entries.push({book:b,read:r})})});
  entries.sort((a,b)=>b.read.date.localeCompare(a.read.date));
  const filtered=search?entries.filter(e=>e.book.title.toLowerCase().includes(search)):entries;
  let html='';filtered.forEach(e=>{
    html+='<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #222;cursor:pointer" onclick="openTileModal('+e.book.id+')">';
    const cover=covers[e.book.id];if(cover)html+='<img src="'+cover+'" style="width:30px;height:45px;object-fit:cover;border-radius:3px">';
    html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+e.book.title+'</div><div style="font-size:10px;color:#888">'+e.book.author+'</div></div>';
    html+='<span style="font-size:10px;color:#888">'+e.read.date+'</span></div>';
  });
  document.getElementById('histList').innerHTML=html||'<p style="color:#888">No reading history yet.</p>';
}

// Duplicates
function openDuplicateFinder(){
  const dupes=[],seen={};
  books.forEach(b=>{if(!b.title||!b.title.trim())return;const key=b.title.trim().toLowerCase();if(seen[key])seen[key].push(b);else seen[key]=[b]});
  Object.values(seen).filter(g=>g.length>1).forEach(group=>dupes.push(group));
  let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button><h2>Duplicate Finder</h2>';
  if(dupes.length===0)html+='<p style="color:#888">No duplicates found.</p>';
  else{dupes.forEach((group,gi)=>{html+='<div style="border:1px solid #333;border-radius:6px;padding:10px;margin-bottom:10px"><div style="font-size:12px;font-weight:bold;color:#e67e22;margin-bottom:6px">'+group[0].title+'</div>';
    group.forEach((b,fi)=>{html+='<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid #222"><div style="flex:1;font-size:11px">ID:'+b.id+' · '+(b.author||'?')+' · '+(b.read?'Read':'Unread')+'</div><button onclick="keepDupe('+gi+','+fi+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">Keep</button></div>'});
    html+='</div>'})}
  document.getElementById('ambiguityModalContent').innerHTML=html;document.getElementById('ambiguityModal').style.display='block';window._dupeGroups=dupes;
}
function keepDupe(gi,ki){const group=window._dupeGroups[gi];group.forEach((b,i)=>{if(i!==ki){books=books.filter(x=>x.id!==b.id);deletedIds.push(b.id);delete covers[b.id]}});save();openDuplicateFinder();renderGrid()}

// Delete mode
function toggleDeleteMode(){deleteMode=!deleteMode;selectedIds.clear();document.getElementById('deleteToggle').style.color=deleteMode?'#e24b4a':'';document.getElementById('deleteBar').style.display=deleteMode?'flex':'none';document.body.classList.toggle('delete-mode',deleteMode);renderGrid()}
function toggleSelect(id){if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);renderGrid()}

// Open Library API
async function fetchCover(b,showPicker){
  try{
    const resp=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(b.title+(b.author?' '+b.author:''))+'&limit=5&fields=key,title,author_name,first_publish_year,number_of_pages_median,cover_i,edition_count,ratings_average');
    const data=await resp.json();
    if(!data.docs||data.docs.length===0)return;

    // Score results
    const scored=data.docs.map(doc=>{
      let score=0;
      const docTitle=(doc.title||'').toLowerCase();
      if(normalize(docTitle)===normalize(b.title))score+=10;
      else if(docTitle.includes(b.title.toLowerCase()))score+=5;
      if(b.author&&doc.author_name&&doc.author_name.some(a=>a.toLowerCase().includes(b.author.toLowerCase().split(',')[0])))score+=8;
      if(b.year&&doc.first_publish_year===b.year)score+=3;
      score+=(doc.edition_count||0)/10;
      return{...doc,score};
    }).sort((a,b2)=>b2.score-a.score);

    // If called from fix with multiple close results, show picker
    if(showPicker&&scored.length>1&&scored[0].score-scored[1].score<5){
      const chosen=await showBookPicker(scored.slice(0,4));
      if(chosen)applyBookDoc(b,chosen);
    }else{
      applyBookDoc(b,scored[0]);
    }
  }catch(e){console.error('Open Library error:',e)}
}

function applyBookDoc(b,doc){
  if(doc.cover_i&&!b.coverConfirmed)covers[b.id]='https://covers.openlibrary.org/b/id/'+doc.cover_i+'-M.jpg';
  if(doc.author_name&&!b.author)b.author=doc.author_name[0];
  if(doc.first_publish_year&&!b.year)b.year=doc.first_publish_year;
  if(doc.number_of_pages_median&&!b.pages)b.pages=doc.number_of_pages_median;
  if(doc.key)b.olid=doc.key;
  if(doc.ratings_average&&!b.score)b.score=doc.ratings_average.toFixed(1);
}

function showBookPicker(options){
  return new Promise(resolve=>{
    let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button>';
    html+='<h2>Multiple matches — pick one:</h2>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px">';
    options.forEach((doc,i)=>{
      const cover=doc.cover_i?'https://covers.openlibrary.org/b/id/'+doc.cover_i+'-M.jpg':'';
      const title=doc.title||'Unknown';
      const author=(doc.author_name||[])[0]||'';
      const year=doc.first_publish_year||'';
      html+='<div style="cursor:pointer;width:120px;text-align:center" onclick="window._bookPickResolve('+i+')">';
      if(cover)html+='<img src="'+cover+'" style="width:100%;border-radius:4px">';
      else html+='<div style="width:100%;height:160px;background:#222;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666">No cover</div>';
      html+='<div style="font-size:11px;margin-top:4px;color:#eee">'+title+'</div>';
      html+='<div style="font-size:10px;color:#888">'+author+' ('+year+')</div>';
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('ambiguityModalContent').innerHTML=html;
    document.getElementById('ambiguityModal').style.display='block';
    window._bookPickResolve=function(idx){
      document.getElementById('ambiguityModal').style.display='none';
      resolve(options[idx]);
    };
  });
}

async function refreshMetadata(id){const b=books.find(x=>x.id===id);if(!b)return;b.coverConfirmed=false;await fetchCover(b);save();openTileModal(id)}

async function backgroundFetch(){
  const toFetch=books.filter(b=>!covers[b.id]&&!b.coverConfirmed);
  if(toFetch.length===0)return;fetchingCovers=true;
  let done=0;
  for(const b of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#e67e22">🖼 Fetching covers... '+done+'/'+toFetch.length+'</span>';
    await fetchCover(b);await new Promise(r=>setTimeout(r,300));
  }
  fetchingCovers=false;save();renderGrid();
}

async function reimportCovers(){
  const toFetch=books.filter(b=>!b.coverConfirmed);
  if(toFetch.length===0){updateStats();return}
  toFetch.forEach(b=>{delete covers[b.id];b.olid='';b.coverWrong=false});
  save();renderGrid();fetchingCovers=true;
  let done=0;
  for(const b of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#e67e22">🖼 Reimporting covers... '+done+'/'+toFetch.length+' (confirmed covers skipped)</span>';
    await fetchCover(b);await new Promise(r=>setTimeout(r,300));
  }
  fetchingCovers=false;save();renderGrid();
}

async function fetchScores(){
  const toFetch=books.filter(b=>!b.score);
  if(toFetch.length===0){document.getElementById('statsBar').innerHTML+='<span style="color:#2ecc71"> ✓ All scores fetched</span>';return}
  let done=0;
  for(const b of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#e67e22">⭐ Fetching scores... '+done+'/'+toFetch.length+'</span>';
    try{
      const resp=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(b.title+(b.author?' '+b.author:''))+'&limit=1&fields=ratings_average');
      const data=await resp.json();
      if(data.docs&&data.docs[0]&&data.docs[0].ratings_average){
        b.score=data.docs[0].ratings_average.toFixed(1);
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,300));
  }
  save();renderGrid();
}

// Close modals on overlay click
document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')){e.target.style.display='none';renderGrid()}});

// Startup
function mergeNewList(){
  const existing=new Set(books.map(b=>normalize(b.title)));
  const deleted=new Set(deletedIds);
  NEWLIST.forEach(item=>{
    const norm=normalize(item.title);
    if(!existing.has(norm)){
      maxId++;
      const nb=makeBook(item.title,maxId);
      nb.author=item.author||'';nb.year=item.year||0;nb.pages=item.pages||0;nb.category=item.category||'';
      if(item.bookType)nb.bookType=item.bookType;
      if(item.bookClub)nb.bookClub=true;
      if(item.bookClubNominee)nb.bookClubNominee=true;
      books.push(nb);existing.add(norm);
    }
  });
  // Ensure bookType is correctly set from NEWLIST for all items
  const typeMap={},clubMap={};
  NEWLIST.forEach(i=>{if(i.bookType)typeMap[normalize(i.title)]=i.bookType;if(i.bookClub)clubMap[normalize(i.title)]=true});
  books.forEach(b=>{
    const correctType=typeMap[normalize(b.title)];
    if(correctType)b.bookType=correctType;
    else if(!b.bookType)b.bookType='novel';
    if(clubMap[normalize(b.title)])b.bookClub=true;
  });
}
function init(){
  load();runMigrations();updateMaxId();mergeNewList();
  save();populateFilters();renderGrid();setTimeout(()=>backgroundFetch(),500)
}
init();
<\/script></body></html>`;

let games=[],covers={},maxId=0,deleteMode=false,selectedIds=new Set(),fetchingCovers=false;

function normalize(t){return(t||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function makeSortTitle(t){return(t||'').toLowerCase().replace(/^(the|a|an)\\s+/,'')}
function makeGame(title,id){return{id,title,addedDate:new Date().toISOString(),sortTitle:makeSortTitle(title),year:0,designer:'',category:'',players:'',weight:0,goatTier:0,rating:'',played:false,playHistory:[],notes:'',bggId:null,bggRating:'',coverConfirmed:false}}

function save(){localStorage.setItem('bg_games',JSON.stringify(games));localStorage.setItem('bg_covers',JSON.stringify(covers))}
function load(){const s=localStorage.getItem('bg_games');if(s)games=JSON.parse(s);else games=[...FULL_SEED];const c=localStorage.getItem('bg_covers');if(c)covers=JSON.parse(c);else covers={}}
function runMigrations(){games.forEach(g=>{if(g.playHistory===undefined)g.playHistory=[];if(g.weight===undefined)g.weight=0;if(g.players===undefined)g.players='';if(g.sortTitle===undefined)g.sortTitle=makeSortTitle(g.title);if(g.bggRating===undefined)g.bggRating='';if(g.coverConfirmed===undefined)g.coverConfirmed=false})}
function updateMaxId(){maxId=games.reduce((m,g)=>Math.max(m,g.id),0)}
function getPlayCount(g){return(g.playHistory||[]).length}

function getFiltered(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const cat=document.getElementById('categoryFilter').value;
  const players=document.getElementById('playersFilter').value;
  const rating=document.getElementById('ratingFilter').value;
  return games.filter(g=>{
    if(search&&!g.title.toLowerCase().includes(search)&&!(g.designer||'').toLowerCase().includes(search))return false;
    if(cat&&g.category!==cat)return false;
    if(players){const min=parseInt((g.players||'0').split('-')[0])||0;const max=parseInt((g.players||'0').split('-')[1])||min;const p=parseInt(players);if(p<min||p>max)return false}
    if(rating){
      if(rating==='goat'){if(g.goatTier===0)return false}
      else if(rating==='unrated'){if(g.rating!==''||g.goatTier>0)return false;if(!g.played)return false}
      else{if(g.goatTier>0)return true;if(g.rating!==rating)return false}
    }
    return true;
  });
}
function sortItems(items){
  const sort=document.getElementById('sortSelect').value;const copy=[...items];
  if(sort==='az')return copy.sort((a,b)=>(a.sortTitle||'').localeCompare(b.sortTitle||''));
  if(sort==='year')return copy.sort((a,b)=>(b.year||0)-(a.year||0));
  if(sort==='mostplayed')return copy.sort((a,b)=>getPlayCount(b)-getPlayCount(a));
  if(sort==='weight')return copy.sort((a,b)=>(b.weight||0)-(a.weight||0));
  return copy.sort((a,b)=>{
    const tierOrder=t=>t.goatTier>0?4-t.goatTier:t.rating==='amazing'?4:t.rating==='good'?5:t.rating==='meh'?6:t.rating==='dislike'?7:t.rating==='neveragain'?8:t.played?9:10;
    const ta=tierOrder(a),tb=tierOrder(b);if(ta!==tb)return ta-tb;
    return(a.sortTitle||'').localeCompare(b.sortTitle||'');
  });
}
function getTierSection(g){
  if(g.goatTier===3)return{label:'★★★ GOAT — All-Time Favourites',cls:'goat'};
  if(g.goatTier===2)return{label:'★★ GOAT — Absolute Favourites',cls:'goat'};
  if(g.goatTier===1)return{label:'★ GOAT — Favourites',cls:'goat'};
  if(g.rating==='amazing')return{label:'Amazing',cls:'amazing'};
  if(g.rating==='good')return{label:'Good',cls:'good'};
  if(g.rating==='meh')return{label:'Meh',cls:'meh'};
  if(g.rating==='dislike')return{label:"Didn't Like",cls:'dislike'};
  if(g.rating==='neveragain')return{label:'Never Again',cls:'neveragain'};
  if(g.played)return{label:'Unrated',cls:'unrated'};
  return{label:'Unplayed',cls:'unplayed'};
}

const collapsedSections=new Set();
function toggleSection(header,secId,label){header.classList.toggle('collapsed');document.getElementById(secId).classList.toggle('hidden');if(header.classList.contains('collapsed'))collapsedSections.add(label);else collapsedSections.delete(label)}

function updateStats(){
  const total=games.length,played=games.filter(g=>g.played||g.goatTier>0).length;
  const goats=games.filter(g=>g.goatTier>0).length;
  document.getElementById('statsBar').innerHTML='<span>Total: '+total+'</span><span>Played: '+played+'</span><span>GOAT: '+goats+'</span>';
}
function populateFilters(){
  const sel=document.getElementById('categoryFilter');
  sel.innerHTML='<option value="">All Categories</option>'+CATEGORIES.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
}

function renderGrid(){
  const filtered=getFiltered(),sorted=sortItems(filtered);
  const sort=document.getElementById('sortSelect').value;
  const grid=document.getElementById('grid');let html='',lastSection='',sectionIdx=0;
  sorted.forEach(g=>{
    if(sort==='tier'){
      const sec=getTierSection(g);
      if(sec.label!==lastSection){
        if(lastSection!=='')html+='</div>';sectionIdx++;
        const collapsed=collapsedSections.has(sec.label);
        html+='<div class="section-header '+sec.cls+(collapsed?' collapsed':'')+'" onclick="toggleSection(this,\\'sec'+sectionIdx+'\\',\\''+sec.label.replace(/'/g,"")+'\\')"><span class="collapse-icon">▼</span> '+sec.label+'</div>';
        html+='<div class="section-tiles'+(collapsed?' hidden':'')+'" id="sec'+sectionIdx+'">';
        lastSection=sec.label;
      }
    }
    html+=renderTile(g);
  });
  if(lastSection!=='')html+='</div>';
  grid.innerHTML=html;
  document.getElementById('itemCount').textContent=sorted.length+' items';
  updateStats();
}

function renderTile(g){
  const cover=covers[g.id];
  let imgHtml=cover?'<img class="tile-img" src="'+cover+'" alt="'+g.title+'" loading="lazy">':'<div class="tile-placeholder">'+g.title+'</div>';
  let badges='';
  if(g.goatTier>0)badges+='<div class="goat-banner">'+'★'.repeat(g.goatTier)+' GOAT</div>';
  if(g.goatTier===0&&g.rating)badges+='<span class="rating-pill '+g.rating+'">'+RATING_LABELS[g.rating]+'</span>';
  else if(g.played&&!g.rating&&g.goatTier===0)badges+='<span class="rating-pill rateme">Rate Me</span>';
  const playCount=getPlayCount(g);
  if(playCount>0)badges+='<span class="play-badge">'+playCount+'×</span>';
  if(g.bggRating)badges+='<span class="players-badge">BGG '+g.bggRating+'</span>';
  if(g.bggRating&&parseFloat(g.bggRating)>=8.0)badges+='<span style="position:absolute;top:22px;right:4px;font-size:14px;z-index:2">🏆</span>';
  const selected=deleteMode&&selectedIds.has(g.id)?' selected':'';
  return '<div class="tile'+selected+'" style="'+(selected?'border:2px solid #e24b4a':'')+'" onclick="'+(deleteMode?'toggleSelect('+g.id+')':'openTileModal('+g.id+')')+'"><div class="tile-img-wrap">'+imgHtml+badges+'</div><div class="tile-info"><div class="tile-title">'+g.title+'</div><div class="tile-year">'+(g.designer?g.designer.split(",")[0]:'')+'</div><div class="tile-genre">'+(g.category||'')+' · '+(g.weight?g.weight.toFixed(1)+'/5':'')+(g.bggRating?' · BGG:'+g.bggRating:'')+'</div></div></div>';
}

function openTileModal(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const cover=covers[g.id]||'';
  let html='<button class="modal-close" onclick="closeTileModal()">&times;</button>';
  html+='<div style="display:flex;gap:12px;align-items:flex-start">';
  if(cover)html+='<img src="'+cover+'" style="width:80px;border-radius:4px">';
  html+='<div><h2>'+g.title+'</h2>';
  html+='<div style="font-size:11px;color:#888;margin:4px 0">';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="openFixModal('+g.id+')">✎ Fix</button>';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="refreshMetadata('+g.id+')">⟳ Refresh</button>';
  html+='<button class="btn-secondary" style="font-size:10px;padding:2px 6px;margin-right:4px" onclick="fetchDetails('+g.id+')">📋 Details</button>';
  html+='<button style="font-size:10px;padding:2px 6px;background:#e24b4a;color:#fff;border:none;border-radius:4px;cursor:pointer" onclick="deleteGame('+g.id+')">🗑 Delete</button>';
  html+='</div>';
  html+='<div style="font-size:12px;color:#aaa;margin-top:4px">'+(g.designer||'Unknown')+' · '+(g.year||'')+'</div>';
  if(g.bggRating)html+='<div style="font-size:12px;color:#9b59b6;margin-top:2px">BGG: '+g.bggRating+'</div>';
  html+='</div></div>';
  html+='<div id="detailsBox" style="display:none;background:#0f0f0f;border-radius:6px;padding:10px;margin:10px 0;font-size:12px;color:#ccc;line-height:1.5"></div>';
  html+='<div class="metadata-card">';
  html+='<div><strong>Designer:</strong> '+(g.designer||'N/A')+'</div>';
  html+='<div><strong>Year:</strong> '+(g.year||'N/A')+'</div>';
  html+='<div><strong>Players:</strong> '+(g.players||'N/A')+'</div>';
  html+='<div><strong>Weight:</strong> '+(g.weight?g.weight+'/5':'N/A')+'</div>';
  html+='<div><strong>BGG Rating:</strong> '+(g.bggRating||'N/A')+'</div>';
  html+='<div><strong>Category:</strong> '+(g.category||'N/A')+'</div>';
  html+='<div><strong>Plays:</strong> '+getPlayCount(g)+'</div>';
  html+='<div><strong>Notes:</strong> '+(g.notes||'—')+'</div>';
  if(g.bggId)html+='<div><a href="https://boardgamegeek.com/boardgame/'+g.bggId+'" target="_blank" style="color:#9b59b6">BGG ↗</a></div>';
  html+='</div>';
  // GOAT tier
  html+='<label>GOAT Tier</label><div class="tier-btns">';
  [3,2,1,0].forEach(t=>{html+='<button class="'+(g.goatTier===t?'active':'')+'" onclick="setGoatTier('+g.id+','+t+')">'+(t===0?'Not GOAT':'★'.repeat(t)+' GOAT')+'</button>'});
  html+='</div>';
  // Rating
  html+='<label>Rating</label><div class="rating-btns">';
  ['amazing','good','meh','dislike','neveragain'].forEach(r=>{html+='<button class="'+(g.rating===r?'active-'+r:'')+'" onclick="setRating('+g.id+',\\''+r+'\\')">'+RATING_LABELS[r]+'</button>'});
  html+='</div>';
  // Category
  html+='<label>Category</label><div class="genre-btns">';
  CATEGORIES.forEach(c=>{html+='<button class="'+(g.category===c?'active':'')+'" onclick="setCat('+g.id+',\\''+c+'\\')">'+c+'</button>'});
  html+='</div>';
  // Cover URL
  html+='<label>Cover Image URL</label><div style="display:flex;gap:6px;margin:4px 0"><input id="coverUrlInput" value="'+(covers[g.id]||'')+'" placeholder="Paste image URL from BGG" style="flex:1;font-size:11px"><button class="btn-secondary" style="font-size:10px" onclick="saveCoverUrl('+g.id+')">Set</button></div>';
  // Log play
  html+='<div style="margin-top:10px"><button class="btn-primary" onclick="logPlay('+g.id+')">Log Play</button> <button class="btn-danger" onclick="deleteGame('+g.id+')">🗑 Delete</button></div>';
  document.getElementById('tileModalContent').innerHTML=html;
  document.getElementById('tileModal').style.display='block';
}
function closeTileModal(){document.getElementById('tileModal').style.display='none';renderGrid()}
function setGoatTier(id,tier){const g=games.find(x=>x.id===id);if(!g)return;g.goatTier=tier;if(tier>0){g.rating='';g.played=true}save();openTileModal(id)}
function setRating(id,rating){const g=games.find(x=>x.id===id);if(!g)return;g.goatTier=0;g.rating=rating;g.played=true;save();openTileModal(id)}
function setCat(id,cat){const g=games.find(x=>x.id===id);if(!g)return;g.category=cat;save();openTileModal(id)}

function openFixModal(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  let html='<button class="modal-close" onclick="closeFixModal()">&times;</button><h2>Fix Board Game</h2>';
  html+='<label>Title</label><input id="fixTitle" value="'+g.title+'">';
  html+='<label>Designer</label><input id="fixDesigner" value="'+(g.designer||'')+'">';
  html+='<label>Year</label><input id="fixYear" type="number" value="'+(g.year||'')+'">';
  html+='<label>Players (e.g. 2-4)</label><input id="fixPlayers" value="'+(g.players||'')+'">';
  html+='<label>Weight (1-5)</label><input id="fixWeight" type="number" step="0.1" min="1" max="5" value="'+(g.weight||'')+'">';
  html+='<label>BGG ID</label><input id="fixBggId" value="'+(g.bggId||'')+'">';
  html+='<label>Category</label><select id="fixCat"><option value="">—</option>'+CATEGORIES.map(c=>'<option value="'+c+'" '+(g.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select>';
  html+='<div class="modal-actions"><button class="btn-primary" onclick="saveFixModal('+g.id+')">Save</button><button class="btn-secondary" onclick="closeFixModal()">Cancel</button></div>';
  document.getElementById('ambiguityModalContent').innerHTML=html;document.getElementById('ambiguityModal').style.display='block';
}
function closeFixModal(){document.getElementById('ambiguityModal').style.display='none'}
function saveFixModal(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  g.title=document.getElementById('fixTitle').value;g.sortTitle=makeSortTitle(g.title);
  g.designer=document.getElementById('fixDesigner').value;
  g.year=parseInt(document.getElementById('fixYear').value)||0;
  g.players=document.getElementById('fixPlayers').value;
  g.weight=parseFloat(document.getElementById('fixWeight').value)||0;
  const bggId=document.getElementById('fixBggId').value;if(bggId)g.bggId=parseInt(bggId);
  const cat=document.getElementById('fixCat').value;if(cat)g.category=cat;
  save();closeFixModal();renderGrid();openTileModal(id);
}

function saveCoverUrl(id){
  const url=document.getElementById('coverUrlInput').value.trim();
  if(!url)return;
  covers[id]=url;save();openTileModal(id);
}

async function fetchWithRetry(url,retries){
  for(let i=0;i<(retries||3);i++){
    try{
      const resp=await fetch(url);
      if(resp.ok)return await resp.text();
      if(resp.status===202){await new Promise(r=>setTimeout(r,3000));continue}
    }catch(e){}
    await new Promise(r=>setTimeout(r,2000));
  }
  return null;
}

async function fetchBggMetadata(g){
  try{
    let bggId=g.bggId;
    if(!bggId){
      const text=await fetchWithRetry(getBggUrl('/search?query='+encodeURIComponent(g.title)+'&type=boardgame'),2);
      if(!text)return;
      const parser=new DOMParser();const xml=parser.parseFromString(text,'text/xml');
      const items=xml.querySelectorAll('item');
      if(items.length===0)return;
      let best=items[0];
      for(const item of items){const name=item.querySelector('name');if(name&&normalize(name.getAttribute('value'))===normalize(g.title)){best=item;break}}
      bggId=best.getAttribute('id');
      g.bggId=parseInt(bggId);
    }
    const text=await fetchWithRetry(getBggUrl('/thing?id='+bggId+'&stats=1'),3);
    if(!text)return;
    const parser=new DOMParser();const xml=parser.parseFromString(text,'text/xml');
    const item=xml.querySelector('item');if(!item)return;
    const img=item.querySelector('image');
    if(img&&img.textContent&&!g.coverConfirmed)covers[g.id]=img.textContent;
    const yr=item.querySelector('yearpublished');if(yr)g.year=parseInt(yr.getAttribute('value'))||g.year;
    const minP=item.querySelector('minplayers');const maxP=item.querySelector('maxplayers');
    if(minP&&maxP)g.players=minP.getAttribute('value')+'-'+maxP.getAttribute('value');
    const stats=item.querySelector('statistics ratings');
    if(stats){
      const avgWeight=stats.querySelector('averageweight');
      if(avgWeight)g.weight=parseFloat(avgWeight.getAttribute('value'))||0;
      const avgRating=stats.querySelector('average');
      if(avgRating)g.bggRating=parseFloat(avgRating.getAttribute('value')).toFixed(1);
    }
    const designers=[...item.querySelectorAll('link[type="boardgamedesigner"]')].map(l=>l.getAttribute('value'));
    if(designers.length)g.designer=designers.join(', ');
  }catch(e){console.error('BGG fetch error:',e);
    const box=document.getElementById('detailsBox');
    if(box){box.style.display='block';box.textContent='BGG Error: '+e.message+' | URL tried: '+getBggUrl('/thing?id='+(g.bggId||'unknown')+'&stats=1')}
  }
}

async function fetchDetails(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const box=document.getElementById('detailsBox');box.style.display='block';box.textContent='Loading...';
  try{
    let bggId=g.bggId;
    if(!bggId){box.textContent='No BGG ID. Try Refresh first.';return}
    const text=await fetchWithRetry(getBggUrl('/thing?id='+bggId),2);
    if(!text){box.textContent='Failed to fetch from BGG.';return}
    const parser=new DOMParser();const xml=parser.parseFromString(text,'text/xml');
    const desc=xml.querySelector('description');
    box.textContent=desc?desc.textContent.substring(0,1000):'No description available.';
  }catch(e){box.textContent='Error: '+e.message}
}

async function refreshMetadata(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  g.coverConfirmed=false;
  const box=document.getElementById('detailsBox');
  if(box){box.style.display='block';box.textContent='Fetching from BGG...';}
  try{
    const url=getBggUrl('/thing?id='+g.bggId+'&stats=1');
    const resp=await fetch(url);
    const text=await resp.text();
    if(box)box.textContent='Status:'+resp.status+' Length:'+text.length+' Start:'+text.substring(0,100);
    // Try to parse
    const parser=new DOMParser();const xml=parser.parseFromString(text,'text/xml');
    const item=xml.querySelector('item');
    if(item){
      const img=item.querySelector('image');
      if(img&&img.textContent){covers[g.id]=img.textContent;if(box)box.textContent+=' | COVER:'+img.textContent.substring(0,50)}
      else{if(box)box.textContent+=' | NO IMAGE TAG'}
    }else{if(box)box.textContent+=' | NO ITEM IN XML'}
    save();renderGrid();
  }catch(e){if(box)box.textContent='ERROR: '+e.message}
}

async function reimportCovers(){
  const toFetch=[...games];
  toFetch.forEach(g=>{delete covers[g.id];g.coverConfirmed=false});
  save();renderGrid();
  fetchingCovers=true;let done=0;
  for(const g of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#9b59b6">🖼 Fetching covers... '+done+'/'+toFetch.length+'</span>';
    await fetchBggMetadata(g);
    await new Promise(r=>setTimeout(r,1500));
  }
  fetchingCovers=false;save();renderGrid();
}

async function backgroundFetch(){
  const toFetch=games.filter(g=>!covers[g.id]&&!g.coverConfirmed);
  if(toFetch.length===0)return;
  fetchingCovers=true;let done=0;
  for(const g of toFetch){
    done++;
    document.getElementById('statsBar').innerHTML='<span style="color:#9b59b6">🖼 Fetching... '+done+'/'+toFetch.length+'</span>';
    await fetchBggMetadata(g);
    await new Promise(r=>setTimeout(r,1500));
  }
  fetchingCovers=false;save();renderGrid();
}

async function getSuggestions(){
  const mood=document.getElementById('suggestMood').value;
  const goats=games.filter(g=>g.goatTier>0).map(g=>g.title).slice(0,10);
  const amazings=games.filter(g=>g.rating==='amazing').map(g=>g.title).slice(0,10);
  const prompt='I love these board games: '+goats.join(', ')+'. I also rate these highly: '+amazings.join(', ')+'. '+(mood?'Preference: '+mood+'. ':'')+'Suggest 10 board games I might love. Return ONLY a JSON array of objects with keys: title, year, reason (one sentence). No other text.';
  document.getElementById('suggestResults').innerHTML='<p style="color:#888">Asking AI...</p>';
  try{
    const resp=await fetch('https://ditw97qgs2.execute-api.eu-north-1.amazonaws.com/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const text=data.choices[0].message.content;
    const match=text.match(/\\[.*\\]/s);
    if(match){
      let suggestions;try{suggestions=JSON.parse(match[0])}catch(pe){try{suggestions=JSON.parse(match[0].split(String.fromCharCode(10)).join(' ').split(String.fromCharCode(13)).join(' '))}catch(pe2){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">AI returned invalid JSON. Try again.</p>';return}}
      const existing=games.map(g=>g.title.toLowerCase());
      let html='';
      suggestions.forEach(s=>{
        const inLib=existing.includes(s.title.toLowerCase());
        html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+s.title+' ('+s.year+')</div><div style="font-size:10px;color:#888">'+s.reason+'</div>'+(inLib?'<span style="font-size:9px;color:#888">In library</span>':'')+'</div>';
      });
      document.getElementById('suggestResults').innerHTML=html;
    }else{document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Could not parse AI response.</p>'}
  }catch(e){document.getElementById('suggestResults').innerHTML='<p style="color:#e24b4a">Error: '+e.message+'</p>'}
}
function getLocalSuggestions(){
  const loved=games.filter(g=>g.goatTier>0||g.rating==='amazing');
  const catScores={},desScores={};
  loved.forEach(g=>{if(g.category)catScores[g.category]=(catScores[g.category]||0)+1;if(g.designer)(g.designer).split(',').forEach(d=>{const t=d.trim();if(t)desScores[t]=(desScores[t]||0)+1})});
  const unplayed=games.filter(g=>!g.played&&g.goatTier===0);
  const scored=unplayed.map(g=>{let score=0;if(g.category&&catScores[g.category])score+=catScores[g.category]*3;if(g.designer)(g.designer).split(',').forEach(d=>{const t=d.trim();if(desScores[t])score+=desScores[t]*5});if(g.bggRating&&parseFloat(g.bggRating)>=8.0)score+=3;score+=Math.random()*2;return{game:g,score}}).sort((a,b)=>b.score-a.score).slice(0,10);
  let html='';
  if(scored.length===0)html='<p style="color:#888">No unplayed games to suggest.</p>';
  else scored.forEach(s=>{const g=s.game;
    html+='<div style="padding:8px 0;border-bottom:1px solid #222"><div style="font-size:12px;font-weight:600">'+g.title+'</div><div style="font-size:10px;color:#888">'+(g.category||'')+' · '+(g.bggRating?'BGG:'+g.bggRating:'')+'</div></div>';
  });
  document.getElementById('suggestResults').innerHTML=html;
}

// Duplicates
function openDuplicateFinder(){
  const dupes=[],seen={};
  games.forEach(g=>{if(!g.title)return;const key=g.title.trim().toLowerCase();if(seen[key])seen[key].push(g);else seen[key]=[g]});
  Object.values(seen).filter(gr=>gr.length>1).forEach(group=>dupes.push(group));
  let html='<button class="modal-close" onclick="document.getElementById(\\'ambiguityModal\\').style.display=\\'none\\'">&times;</button><h2>Duplicate Finder</h2>';
  if(dupes.length===0)html+='<p style="color:#888">No duplicates found.</p>';
  else{dupes.forEach((group,gi)=>{html+='<div style="border:1px solid #333;border-radius:6px;padding:10px;margin-bottom:10px"><div style="font-size:12px;font-weight:bold;color:#9b59b6;margin-bottom:6px">'+group[0].title+'</div>';
    group.forEach((g,fi)=>{html+='<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid #222"><div style="flex:1;font-size:11px">ID:'+g.id+' · '+(g.designer||'?')+' · '+(g.played?'Played':'Unplayed')+'</div><button onclick="keepDupe('+gi+','+fi+')" style="background:#2ecc71;color:#000;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:10px">Keep</button></div>'});
    html+='</div>'})}
  document.getElementById('ambiguityModalContent').innerHTML=html;document.getElementById('ambiguityModal').style.display='block';window._dupeGroups=dupes;
}
function keepDupe(gi,ki){const group=window._dupeGroups[gi];group.forEach((g,i)=>{if(i!==ki){games=games.filter(x=>x.id!==g.id);delete covers[g.id]}});save();openDuplicateFinder();renderGrid()}

  games.forEach(g=>{

    if(seed){
      if(!g.designer&&seed.designer)g.designer=seed.designer;

  });
}
